<!doctype html>
<html lang="ja" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIRAKU</title>
<link rel="icon" href="data:,"><!-- no icon file: without this the browser asks for /favicon.ico (404) -->
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/shelf.css">
<link rel="stylesheet" href="css/test_board.css"><!-- ③'s tests at a glance (js/test_board.js) -->
<link rel="stylesheet" href="css/assembly.css">
<link rel="stylesheet" href="css/joints.css"><!-- joints: -->
<link rel="stylesheet" href="css/grip.css"><!-- grip: the tyre view (js/grip_panel.js) -->
<link rel="stylesheet" href="css/energy_flow.css"><!-- the energy's flow (js/energy_flow.js) -->
<link rel="stylesheet" href="css/node_motion.css"><!-- node_motion: -->
<link rel="stylesheet" href="css/topbar.css"><!-- the top's back link, the domains' icons, the hooks' line (js/hookline.js) -->
<!-- three.js r170 (0.170.0) from jsDelivr; the version is pinned here and nowhere else. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<!-- while the record is read: this line and the lead's pet only, no frame (js/app.js boot) -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-pet" id="boot-pet"></div>
  <p class="boot-line" id="boot-line">記録を読み込んでいます</p>
</div>
<script>
// before js/app.js runs: the line for a page that reads no record, and the line that says why when
// the screen's files never come (app.js clears this timer and keeps its own)
(function () {
  var q = location.search, line = document.getElementById("boot-line");
  if (!/[?&](run|src)=/.test(q) && (/[?&](list|new)=/.test(q) || !document.querySelector('meta[name="hiraku-static"]'))) line.textContent = "読み込んでいます";
  window.hirakuBootFail = function (why) {
    if (!document.documentElement.classList.contains("booting")) return;
    document.getElementById("boot").classList.add("failed");
    line.textContent = "記録を読み込めませんでした (" + why + ")。ページを読み込み直してください";
  };
  // a file of the screen that cannot be read (js/app.js or what it imports)
  window.addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") window.hirakuBootFail("画面のファイル"); }, true);
  window.hirakuBootTimer = setTimeout(function () { window.hirakuBootFail("時間切れ"); }, 60000);
})();
</script>
<div id="stage" class="stage">
  <header class="topbar">
    <!-- back to the list at the top left by the wordmark, on every tab (js/app.js sets the href) -->
    <div class="brand"><span class="wordmark">HIRAKU</span><a class="back-link" id="back-link" href="?list=1" title="ほかのデモを見る・新しく実行する">☰ 一覧へ</a><span class="want" id="want"></span></div>
    <div class="pills">
      <span class="pill" id="pill-version">v—</span>
      <span class="pill" id="pill-cost">費用 —</span>
    </div>
    <div class="mode" id="mode"></div>
    <!-- the present mode (the 3D made large with #expand-btn, or ?present=1): 詳しく brings the panels back over it -->
    <div class="viewswitch" id="viewswitch">
      <button class="detail-btn" id="detail-btn" title="記録・予測と判定・hooks を開く">詳しく</button>
    </div>
  </header>

  <nav class="tabsrow">
    <!-- the tabs: ① to ⑤ in the order of use, then the tool shelf and the rules (js/tabs.js, words in js/labels.js TAB_JA) -->
    <div class="tabs" id="tabs"></div>
    <div class="chips" id="chips"></div>
  </nav>

  <main class="main" id="main">
    <section class="col-left">
      <div class="panel agents">
        <h2>エージェント</h2>
        <ul id="agents"></ul>
      </div>
      <div class="panel logpanel">
        <h2>記録</h2>
        <ol id="log"></ol>
      </div>
    </section>

    <section class="col-center" id="view-bench">
      <div class="tests" id="tests"></div>
      <div class="viewport" id="viewport">
        <!-- the 3D large (the present mode) and back; Esc too (js/app.js applyPresent) -->
        <button class="expand-btn" id="expand-btn" type="button" title="大きく見る" aria-label="大きく見る" aria-pressed="false"></button>
        <div class="now" id="now"></div>
        <div class="toggles" id="toggles"></div>
        <div class="legend" id="legend" data-kind="legend"></div>
        <div class="bubble" id="bubble"></div>
        <div class="hookflash" id="hookflash"></div>
        <div class="causenote" id="causenote" hidden></div>
        <div class="running" id="running"></div>
        <div class="graph" id="graph" data-kind="graph" hidden></div>
        <div class="limitnote" id="limitnote" hidden></div>
        <div class="animbar" id="animbar" hidden>
          <span class="ab-title" id="ab-title"></span>
          <button class="ab-play" id="ab-play" title="この試験の動きだけを再生">▶</button>
          <div class="ab-track" id="ab-track">
            <div class="ab-fill" id="ab-fill"></div>
            <i class="ab-lim" id="ab-lim" title="輪が浮いた時刻"></i>
          </div>
          <span class="ab-time" id="ab-time"></span>
          <span class="ab-note" id="ab-note"></span>
        </div>
        <div class="playbar" id="playbar">
          <button class="pb-play" id="pb-play" title="再生 / 一時停止 (Space)">▶</button>
          <button class="pb-step" id="pb-prev" title="前のイベント (←)">⏮</button>
          <button class="pb-step" id="pb-next" title="次のイベント (→)">⏭</button>
          <!-- the track on the playhead's clock (the event clock: the events in their order); the marks above it by kind -->
          <div class="pb-track" id="pb-track">
            <div class="pb-marks" id="pb-marks"></div>
            <div class="pb-fill" id="pb-fill"></div>
            <div class="pb-ticks" id="pb-ticks"></div>
            <div class="pb-knob" id="pb-knob"></div>
          </div>
          <span class="pb-times"><span class="pb-time" id="pb-time">0.0 / 0.0 秒</span><small class="pb-rec" id="pb-rec"></small></span>
          <button class="pb-jump" id="pb-next-verdict" title="次の判定 (OK / NG) へ">次の判定へ</button>
          <button class="pb-jump" id="pb-next-mismatch" title="次の不一致 (予測と解析の比べ) へ">次の不一致へ</button>
          <button class="pb-clock" id="pb-clock" title="時計: イベントごと (各イベントを短く順に) ⇄ 実時間 (記録の時刻のまま)"></button>
          <button class="pb-speed" id="pb-speed" title="速さ">1×</button>
          <button class="pb-live" id="pb-live" title="実行中の最新に戻る">LIVE</button>
        </div>
      </div>
      <!-- the sentence card out of the 3D: one at a time, two lines, くわしく opens it under (js/benchnote.js) -->
      <div class="benchnote" id="benchnote" hidden>
        <div class="bn-row">
          <div class="bn-card" id="bn-card"><div class="hooknote" id="hooknote" hidden></div></div>
          <button class="bn-more" id="bn-more" type="button" title="この札の全文 (記録の ID・英語の文も) を開く">くわしく</button>
        </div>
        <div class="bn-full" id="bn-full" hidden></div>
      </div>
      <p class="hint" id="hint">カメラ: ドラッグで回す・右ドラッグで動かす・ホイールで寄る ／ Space 再生・← → 前後のイベント</p>
      <!-- the workbench's notes (js/app.js): what the real look's dummy is drawn from -->
      <details class="more bench-more" id="bench-more" hidden><summary>くわしく</summary><div class="sub" id="bench-dummy-note" data-role="dummy-note"></div></details>
    </section>

    <!-- the intake screens (A1 request, A2 hearing, A5 knowledge): js/intake/, mounted by js/app.js -->
    <section class="col-center intake-view" id="view-intake" hidden></section>

    <!-- A4 the tool shelf: js/shelf.js, mounted by js/app.js -->
    <!-- (each of these tabs: its first lines on top, いま / 大事 / 次 and a くわしく, js/app.js renderTabHead) -->
    <section class="col-center shelf-view" id="view-shelf" hidden>
      <div class="tab-head" id="tab-head-A4"></div>
      <div class="shelf-host" id="shelf-host"></div>
    </section>

    <!-- A7 the assembly order: js/assembly.js, mounted by js/app.js -->
    <section class="col-center asm-wrap" id="view-asm" hidden>
      <div class="tab-head" id="tab-head-A7"></div>
      <div class="asm-view" id="asm-host"></div>
    </section>

    <section class="col-center grid-view" id="view-grid" hidden>
      <div class="grid-head" id="grid-head"></div>
      <div class="tiles" id="tiles"></div>
      <div class="grid-banner" id="grid-banner" hidden></div>
      <!-- the newest report's next changes (js/report_next.js) -->
      <div class="report-next" id="report-next" data-kind="label" hidden></div>
    </section>

    <section class="col-right">
      <div class="panel chain">
        <h2>予測 → 解析 → 比べる → 判定</h2>
        <!-- what shows first: what is going on, the verdict, what comes next (one line each);
             the four steps' contents (formulas, inputs, sources, rules, ids) are folded under くわしく -->
        <div class="chain-head" id="chain-head"></div>
        <details class="chain-more" id="chain-more" data-keep="chain-more">
          <summary>くわしく (予測・解析・比べる・判定の中身)</summary>
          <div class="card" id="card-pred"></div>
          <div class="card" id="card-ana"></div>
          <div class="card" id="card-cmp"></div>
          <p class="foot">不一致のときは、原因が書かれるまでその分野は先に進めない (hooks)</p>
        </details>
      </div>
    </section>
  </main>

  <footer class="statusrow" id="statusrow">
    <div class="activity" id="activity"></div>
    <div class="hooks" id="hooks"></div>
  </footer>
  <div class="subband" id="subband"></div>

  <!-- the present mode's side: the card, then the colour bar and the graph (moved here while it is on) -->
  <aside class="present-rail" id="present-rail" hidden>
    <div class="present-card" id="present-card"></div>
  </aside>

  <div class="runlist" id="runlist" hidden></div>
  <div class="dropzone" id="dropzone" hidden>events.jsonl をここに落とすと再生します</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
