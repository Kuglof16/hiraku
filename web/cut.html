<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIRAKU cut</title>
<!-- The video's cut pages (js/cut.js). three.js r170 from jsDelivr, the same version as index.html. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="css/assembly.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  .stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    overflow: hidden;
    font-family: "BIZ UDPGothic", "BIZ UDGothic", "Yu Gothic", Meiryo, sans-serif;
    color: #1b1a17;
  }
  .hero { position: absolute; transform-origin: 50% 55%; }
  .tile { position: absolute; box-sizing: border-box; overflow: hidden; transform-origin: 50% 50%; }
  .tile canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile b { position: absolute; font-weight: 700; line-height: 1; white-space: nowrap; background: rgba(247, 244, 236, 0.82); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .tile b small { font-size: 0.7em; font-weight: 400; }
  .tile .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; }
  .tile .chart { position: absolute; background: rgba(247, 244, 236, 0.85); border: 1px solid #c9c3b6; border-radius: 4px; }
  .tile .none { position: absolute; left: 16px; bottom: 12px; font-size: 16px; color: #a8a49a; }
  .err { position: absolute; left: 96px; top: 96px; color: #e0472a; font-size: 24px; }
  /* N01: sizes and colours come from layout.json (set inline by js/cut.js) */
  .n01-view { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n01-view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n01-pane { position: absolute; box-sizing: border-box; }
  .n01-card { box-sizing: border-box; border-style: solid; background: #fbf9f4; }
  .n01-card h3 { margin: 0 0 8px; }
  .n01-card h3 small { display: block; font-size: 0.6em; color: #c8402a; font-weight: 600; margin-bottom: 2px; }
  .n01-card tr.miss td { color: #c8402a; font-weight: 700; }
  .n01-card td small { display: block; font-size: 0.8em; }
  .n01-card td small.ok { color: #2f7d4f; }
  .n01-card td small.miss { color: #c8402a; }
  .n01-card p { margin: 0 0 8px; font-weight: 700; }
  .n01-card .ok { color: #2f7d4f; }
  .n01-card .miss { color: #c8402a; }
  .n01-card table { width: 100%; border-collapse: collapse; }
  .n01-card td:last-child { text-align: right; font-family: Consolas, monospace; }
  .n01-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; align-items: center; margin-bottom: 12px; }
  .n01-legend span:first-child { grid-column: 1 / -1; }
  .n01-legend i { display: block; height: 14px; border-radius: 3px; grid-column: 1 / -1; }
  .n01-legend span:nth-of-type(2) { justify-self: start; }
  .n01-legend span:nth-of-type(3) { justify-self: end; white-space: nowrap; }
  .n01-note { color: #5c5a54; margin: 0; }
  /* N02: sizes and colours from layout.json n02 (set inline) */
  .n02-pane { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n02-pane canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n02-pane b { position: absolute; font-weight: 700; line-height: 1; white-space: nowrap; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .n02-pane .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; }
  .n02-pane .beyond { position: absolute; font-weight: 700; white-space: nowrap; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 1px 4px; }
  .n02-pane .none { position: absolute; left: 16px; bottom: 12px; font-size: 16px; color: #a8a49a; }
  .n02-legend { position: absolute; list-style: none; margin: 0; padding: 0; }
  .n02-legend li { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .n02-result { position: absolute; box-sizing: border-box; }
  .n02-result h3 { margin: 0 0 12px; }
  .n02-res b { display: block; margin-bottom: 2px; }
  .n02-res table { width: 100%; border-collapse: collapse; }
  .n02-res td:last-child { text-align: right; font-family: Consolas, monospace; }
  .n02-res .over { font-weight: 700; margin-top: 2px; }
  .n02-res .ok { color: #2f7d4f; }
  .n02-res .miss { color: #c8402a; }
  /* N04 / N15 (js/cut_grid.js): sizes and colours from layout.json n04 / n15 (set inline) */
  .grid-header { position: absolute; box-sizing: border-box; overflow: hidden; white-space: nowrap; font-weight: 700; color: #1b1a17; }
  .grid-tile .layer { position: absolute; inset: 0; }
  .grid-tile .pet { position: absolute; box-sizing: border-box; pointer-events: none; }
  .n04-assembly { position: absolute; box-sizing: border-box; overflow: hidden; }
  .grid-tile .mark { position: absolute; font-weight: 700; line-height: 1; background: rgba(247, 244, 236, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .grid-tile .asm div { overflow: hidden; text-overflow: ellipsis; }
  .grid-tile .ok { color: #2f7d4f; }
  .grid-tile .miss { color: #c8402a; }
  .grid-tile .rate { background: rgba(247, 244, 236, 0.85); border-radius: 4px; padding: 1px 4px; }
  .grid-tile .tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-weight: 700; color: #1b1a17; background: rgba(251, 249, 244, 0.88); border: 1px solid #c9c3b6; border-radius: 4px; padding: 1px 5px; }
  .grid-tile .tag small { font-size: 1em; font-weight: 400; margin-left: 4px; font-family: Consolas, monospace; }
  .grid-tile .tag.over { color: #c8402a; border-color: #c8402a; }
  .grid-tile .asm { position: absolute; box-sizing: border-box; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(247, 244, 236, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  /* N07 (js/cut_n07.js): sizes and colours from layout.json n07 (set inline) */
  .n07-view { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n07-view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n07-mark { position: absolute; box-sizing: border-box; border: 3px solid; border-radius: 50%; pointer-events: none; }
  .n07-legend { position: absolute; box-sizing: border-box; border: 2px solid; border-radius: 12px; padding: 18px 16px; overflow: hidden; display: flex; flex-direction: column; }
  .n07-legend h3 { margin: 0 0 18px; white-space: nowrap; }
  .n07-legend p { margin: 0 0 14px; color: #5c5a54; }
  .n07-legend .scale { position: relative; flex: 1 1 auto; min-height: 120px; max-height: 420px; margin: 0.6em 0 26px; }
  .n07-legend .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 26px; border: 1.5px solid #1b1a17; box-sizing: border-box; }
  .n07-legend .ticks { position: absolute; left: 36px; right: 0; top: 0; bottom: 0; font-family: Consolas, monospace; }
  .n07-legend .ticks span { position: absolute; left: 0; transform: translateY(-50%); white-space: nowrap; }
  .n07-legend .sw { display: inline-block; width: 16px; height: 16px; vertical-align: -2px; margin-right: 6px; }
  .n07-legend .rows { margin-bottom: 14px; }
  .n07-legend .row { color: #8a857a; margin-bottom: 10px; }
  .n07-legend .row b, .n07-legend .row span { display: block; font-weight: 400; }
  .n07-legend .row span { font-family: Consolas, monospace; }
  .n07-legend .row.on { color: #1b1a17; }
  .n07-legend .row.on b, .n07-legend .row.on span { font-weight: 700; }
  .n07-legend .src { margin: 0; }
  .n07-legend .explain { margin-bottom: 14px; }
  .n07-legend .explain p { margin: 0 0 10px; color: #1b1a17; line-height: 1.3; }
  .n07-label { position: absolute; color: #1b1a17; font-weight: 700; line-height: 1.2; background: rgba(251, 249, 244, 0.88); border: 1.5px solid #c9c3b6; border-radius: 8px; padding: 6px 14px; }
  /* N03 (js/cut_n03.js) and N06 (js/cut_n06.js): sizes and colours from layout.json n03 / n06 (set inline) */
  .n03-view { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n03-view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n03-view .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 1px 4px; }
  .n03-popup { position: absolute; box-sizing: border-box; overflow: hidden; box-shadow: 0 6px 18px rgba(27, 26, 23, 0.18); }
  .n03-popup h3 { margin: 0; line-height: 1; font-weight: 700; }
  .n03-popup .chart { display: block; }
  .n03-popup .none { margin: 0; color: #a8a49a; }
  .n06-tile, .n06-big { position: absolute; box-sizing: border-box; overflow: hidden; transform-origin: 50% 50%; }
  .n06-tile canvas, .n06-big canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n06-tile b, .n06-big b { position: absolute; font-weight: 700; line-height: 1.15; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .n06-tile b .why, .n06-big b .why { font-weight: 700; }
  .n06-tile .mark, .n06-big .mark { position: absolute; font-weight: 700; line-height: 1; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .n06-tile .none, .n06-big .none { position: absolute; color: #a8a49a; }
  /* N17 (js/cut_n17.js): box, sizes and colours from layout.json n17 (set inline); every text is at least the page's own size */
  .n17-page { position: absolute; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; border: 2px solid; border-radius: 12px; line-height: 1.35; }
  .n17-page small { font-size: 1em; font-weight: 400; color: #5c5a54; }
  .n17-head { flex: none; border-bottom: 2px solid #c9c3b6; padding-bottom: 0.5em; margin-bottom: 0.6em; }
  .n17-kicker { color: #5c5a54; }
  .n17-head h2 { margin: 0.1em 0 0.3em; font-weight: 700; line-height: 1.25; }
  .n17-chips { display: flex; flex-wrap: wrap; gap: 0.3em 1.2em; font-weight: 700; }
  .n17-page .ok { color: #2f7d4f; }
  .n17-page .miss { color: #c8402a; }
  .n17-page .wait { color: #8a857a; }
  .n17-body { flex: 1 1 0; min-height: 0; overflow: hidden; }
  .n17-domain { margin-bottom: 0.7em; }
  .n17-domain h3 { margin: 0 0 0.25em; font-size: 1em; font-weight: 700; }
  .n17-line { font-weight: 400; }
  .n17-group { margin: 0.2em 0 0.35em 1em; }
  .n17-group h4 { margin: 0 0 0.1em; font-size: 1em; font-weight: 400; color: #5c5a54; }
  .n17-bar { display: grid; grid-template-columns: minmax(0, 1fr) 34% 5em; align-items: center; gap: 0.8em; padding: 0.05em 0.3em; border-radius: 6px; }
  .n17-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.5; }
  .n17-bar i { position: relative; display: block; height: 0.7em; background: #ece7dc; border-radius: 3px; }
  .n17-bar i b { position: absolute; left: 0; top: 0; bottom: 0; background: #2b59c3; border-radius: 3px; }
  .n17-bar i.mid::after { content: ""; position: absolute; left: 50%; top: -0.15em; bottom: -0.15em; border-left: 2px solid #8a857a; }
  .n17-bar.sens i b { background: #8e6bbf; }
  .n17-num { text-align: right; font-family: Consolas, monospace; }
  .n17-note { margin: 0.15em 0 0.3em 1em; color: #5c5a54; }
  .n17-dropped { margin-left: 0; }
  .n17-next { flex: none; margin-top: 0.5em; padding: 0.5em 0.8em; border: 2px dashed #c9c3b6; border-radius: 10px; transition: none; }
  .n17-next h3 { margin: 0 0 0.2em; font-size: 1em; font-weight: 700; color: #5c5a54; }
  .n17-next ul { margin: 0; padding: 0; list-style: none; }
  .n17-next li { margin: 0.1em 0; }
  .n17-next li b { margin-right: 0.5em; }
  .n17-next li small { display: block; }
  .n17-next.lit { border: 2px solid #d9861c; background: #fff3dc; box-shadow: 0 0 0 4px rgba(217, 134, 28, 0.25), 0 0 28px rgba(217, 134, 28, 0.55); }
  .n17-next.lit h3 { color: #b0650c; }
  .n17-bar.lit { background: #fff3dc; box-shadow: 0 0 0 2px #d9861c, 0 0 18px rgba(217, 134, 28, 0.5); }
  .n17-bar.lit i b { background: #d9861c; }
  /* the story check's note (js/cut.js checkStory): position and size set inline from layout.json */
  .story-over { position: absolute; margin: 0; z-index: 10; white-space: nowrap; color: #c8402a; background: rgba(251, 249, 244, 0.92); border-radius: 4px; padding: 0 6px; }
  /* N06: the ✕ is inside the tile's one tag */
  .n06-tile b .mark, .n06-big b .mark { position: static; background: none; padding: 0; margin: 0; border-radius: 0; }
  .n01-card h3 .num { font-weight: 700; }
  /* the large words: sizes set inline (from the boxes in layout.json) */
  .n01-card .verdict { margin: 0.1em 0 0; font-weight: 700; line-height: 1.1; }
  .n02-pane b .verdict { display: block; margin-top: 0.15em; line-height: 1.1; }
  .n02-pane .ok { color: #2f7d4f; }
  .n02-pane .miss { color: #c8402a; }
  .n03-reading { font-weight: 700; line-height: 1.1; white-space: nowrap; color: #1b1a17; }
  .n07-label .fixed { font-weight: 700; }
  /* N16's list in a narrow column: the checks on their own line under the step's name */
  .n16-steps .asm-steps.compact .nm { max-width: calc(100% - 2em); }
  .n16-steps .asm-steps.compact .cks { float: none; display: flex; margin-left: 1.8em; }
  .n17-change { display: block; font-weight: 700; line-height: 1.2; margin: 0.1em 0; color: #1b1a17; }
  .grid-header .num { font-weight: 700; }
  .n01-view .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 1px 4px; }
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<script type="module" src="js/cut.js"></script>
</body>
</html>
