<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIRAKU cut</title>
<!-- The video's cut pages (js/cut.js). three.js r170 from jsDelivr, the same version as index.html. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="css/assembly.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  .stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    overflow: hidden;
    font-family: "BIZ UDPGothic", "BIZ UDGothic", "Yu Gothic", Meiryo, sans-serif;
    color: #1b1a17;
  }
  .hero { position: absolute; transform-origin: 50% 55%; }
  .tile { position: absolute; box-sizing: border-box; overflow: hidden; transform-origin: 50% 50%; }
  .tile canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .tile b { position: absolute; font-weight: 700; line-height: 1; white-space: nowrap; background: rgba(247, 244, 236, 0.82); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .tile b small { font-size: 0.7em; font-weight: 400; }
  .tile .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; }
  .tile .chart { position: absolute; background: rgba(247, 244, 236, 0.85); border: 1px solid #c9c3b6; border-radius: 4px; }
  .tile .none { position: absolute; left: 16px; bottom: 12px; font-size: 16px; color: #a8a49a; }
  .err { position: absolute; left: 96px; top: 96px; color: #e0472a; font-size: 24px; }
  /* N01: sizes and colours come from layout.json (set inline by js/cut.js) */
  .n01-view { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n01-view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n01-pane { position: absolute; box-sizing: border-box; }
  .n01-card { box-sizing: border-box; border-style: solid; background: #fbf9f4; }
  .n01-card h3 { margin: 0 0 8px; }
  .n01-card h3 small { display: block; font-size: 0.6em; color: #c8402a; font-weight: 600; margin-bottom: 2px; }
  .n01-card tr.miss td { color: #c8402a; font-weight: 700; }
  .n01-card td small { display: block; font-size: 0.8em; }
  .n01-card td small.ok { color: #2f7d4f; }
  .n01-card td small.miss { color: #c8402a; }
  .n01-card p { margin: 0 0 8px; font-weight: 700; }
  .n01-card .ok { color: #2f7d4f; }
  .n01-card .miss { color: #c8402a; }
  .n01-card table { width: 100%; border-collapse: collapse; }
  .n01-card td:last-child { text-align: right; font-family: Consolas, monospace; }
  .n01-legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; margin-bottom: 12px; }
  .n01-legend i { display: block; height: 14px; border-radius: 3px; }
  .n01-legend span:nth-of-type(2) { grid-column: 2; justify-self: start; }
  .n01-legend span:nth-of-type(3) { grid-column: 2; justify-self: end; margin-top: -1.2em; }
  .n01-note { color: #5c5a54; margin: 0; }
  /* N02: sizes and colours from layout.json n02 (set inline) */
  .n02-pane { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n02-pane canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n02-pane b { position: absolute; font-weight: 700; line-height: 1; white-space: nowrap; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .n02-pane .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; }
  .n02-pane .beyond { position: absolute; font-weight: 700; white-space: nowrap; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 1px 4px; }
  .n02-pane .none { position: absolute; left: 16px; bottom: 12px; font-size: 16px; color: #a8a49a; }
  .n02-legend { position: absolute; list-style: none; margin: 0; padding: 0; }
  .n02-legend li { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .n02-result { position: absolute; box-sizing: border-box; }
  .n02-result h3 { margin: 0 0 12px; }
  .n02-res b { display: block; margin-bottom: 2px; }
  .n02-res table { width: 100%; border-collapse: collapse; }
  .n02-res td:last-child { text-align: right; font-family: Consolas, monospace; }
  .n02-res .over { font-weight: 700; margin-top: 2px; }
  .n02-res .ok { color: #2f7d4f; }
  .n02-res .miss { color: #c8402a; }
  /* N04 / N15 (js/cut_grid.js): sizes and colours from layout.json n04 / n15 (set inline) */
  .grid-header { position: absolute; box-sizing: border-box; overflow: hidden; white-space: nowrap; font-weight: 700; color: #1b1a17; }
  .grid-tile .layer { position: absolute; inset: 0; }
  .grid-tile .pet { position: absolute; box-sizing: border-box; pointer-events: none; }
  .n04-assembly { position: absolute; box-sizing: border-box; overflow: hidden; }
  .grid-tile .mark { position: absolute; font-weight: 700; line-height: 1; background: rgba(247, 244, 236, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  .grid-tile .asm div { overflow: hidden; text-overflow: ellipsis; }
  .grid-tile .ok { color: #2f7d4f; }
  .grid-tile .miss { color: #c8402a; }
  .grid-tile .rate { background: rgba(247, 244, 236, 0.85); border-radius: 4px; padding: 1px 4px; }
  .grid-tile .tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-weight: 700; color: #1b1a17; background: rgba(251, 249, 244, 0.88); border: 1px solid #c9c3b6; border-radius: 4px; padding: 1px 5px; }
  .grid-tile .tag small { font-size: 1em; font-weight: 400; margin-left: 4px; font-family: Consolas, monospace; }
  .grid-tile .tag.over { color: #c8402a; border-color: #c8402a; }
  .grid-tile .asm { position: absolute; box-sizing: border-box; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(247, 244, 236, 0.85); border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
  /* N07 (js/cut_n07.js): sizes and colours from layout.json n07 (set inline) */
  .n07-view { position: absolute; box-sizing: border-box; overflow: hidden; }
  .n07-view canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .n07-mark { position: absolute; box-sizing: border-box; border: 3px solid; border-radius: 50%; pointer-events: none; }
  .n07-legend { position: absolute; box-sizing: border-box; border: 2px solid; border-radius: 12px; padding: 16px 20px; overflow: hidden; }
  .n07-legend h3 { margin: 0 0 4px; }
  .n07-legend p { margin: 0 0 10px; color: #5c5a54; }
  .n07-legend .bar { display: block; height: 18px; border-radius: 3px; }
  .n07-legend .ends { display: flex; justify-content: space-between; margin: 4px 0 12px; font-family: Consolas, monospace; }
  .n07-legend .sw { display: inline-block; width: 16px; height: 16px; vertical-align: -2px; }
  .n07-legend table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .n07-legend td { padding: 4px 0; color: #8a857a; }
  .n07-legend td:last-child { text-align: right; font-family: Consolas, monospace; }
  .n07-legend tr.on td { color: #1b1a17; font-weight: 700; }
  .n07-legend .src { margin: 0; }
  .n07-label { position: absolute; color: #1b1a17; line-height: 1.35; }
  .n07-label b { margin-right: 0.4em; }
  .n01-view .rate { position: absolute; font-family: Consolas, monospace; color: #5c5a54; background: rgba(251, 249, 244, 0.85); border-radius: 4px; padding: 1px 4px; }
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<script type="module" src="js/cut.js"></script>
</body>
</html>
