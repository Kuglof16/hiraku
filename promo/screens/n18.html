<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>N18 Title (closing)</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="title.css">
<style>
  /* N18: a vertical light opens in the dark, the vehicle is drawn over it,
     then the name, the line and the repository. Ends on black. */
  :root {
    --page-bg: var(--night);
    --t-line: 0.15s;    /* thin vertical line grows */
    --t-open: 0.8s;     /* the line opens into a band */
    --t-draw: 1.1s;     /* vehicle strokes start */
    --t-name: 2.3s;
    --t-tag: 3.0s;
    --t-url: 3.6s;
    --t-out: 8.2s;      /* fade to black */
  }

  .light { left: calc(895 * var(--u)); top: calc(40 * var(--u));
           width: calc(130 * var(--u)); height: calc(470 * var(--u)); }

  .vehicle {
    position: absolute;
    left: calc(750 * var(--u));
    top: calc(130 * var(--u));
    width: calc(420 * var(--u));
  }

  .name { top: calc(545 * var(--u)); font-size: calc(170 * var(--u)); }
  .tag  { top: calc(745 * var(--u)); }
  .url {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(826 * var(--u));
    text-align: center;
    font: 400 calc(30 * var(--u)) / 1 var(--font-mono);
    letter-spacing: 0.02em;
    color: var(--on-night-soft);
    animation: fade-up 0.6s ease-out both;
    animation-delay: var(--t-url);
  }
  .url .powered { display: none; }
  html.powered .url .powered { display: inline; }

  .all {
    position: absolute;
    inset: 0;
    animation: fade-out 0.8s ease-in both;
    animation-delay: var(--t-out);
  }
  @keyframes fade-out { to { opacity: 0; } }
</style>
</head>
<body data-duration="9">
<div class="stage night">
  <div class="all">
    <div class="safe">
      <div class="light"><div class="light-glow"></div><div class="light-core"></div></div>
      <div class="vehicle draw-on"></div>
      <h1 class="name" aria-label="HIRAKU"></h1>
      <p class="tag">CAE を、すべての作り手へ拓く。</p>
      <p class="url">github.com/Kuglof16/hiraku<span class="powered"> · Powered by Claude</span></p>
    </div>
  </div>
  <div class="guide-band"></div>
  <div class="clock"></div>
</div>
<script src="vehicle.js"></script>
<script>
  document.querySelector(".vehicle").innerHTML = drawVehicle({ halo: true });
  document.querySelector(".name").innerHTML = [..."HIRAKU"]
    .map((c, i) => `<span style="--i:${i}">${c}</span>`).join("");
  if (new URLSearchParams(location.search).get("powered") === "1")
    document.documentElement.classList.add("powered");
</script>
<script src="timeline.js"></script>
</body>
</html>
