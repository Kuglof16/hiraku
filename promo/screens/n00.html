<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>N00 HIRAKU</title>
<link rel="stylesheet" href="common.css">
<script src="layout.data.js"></script>
<script src="layout.js" data-cut="n00"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  /* N00: the name, one line that says what HIRAKU is, and the ten 3D pets
     (promo/pets/pet3d.js). Lead, designer and packager sit on the top edge
     of the name from the start (each comes in with its letter); the seven
     CAE domain pets stand in a row over their chips, and as each chip
     lights its pet jumps up onto its seat on the name. Placement and
     times: layout.json n00 (CSS variables from layout.js; --t-name,
     --t-tagline, --t-row, --t-light, --t-step from n00.times). Chips are
     placed by the script below from n00.pets; the pets' boxes are placed
     at each t by the module from n00.pets, n00.title_pets and n00.motion.
     Each jump is pet3d's anim.hop (crouch, parabola, stretch, landing squash,
     small bounces, settle) with each role's own values (n00.play.jump / cast).
     After the name has been said the pets play with the letters (n00.play):
     a letter sinks and comes back when a pet lands on it, by its weight
     (harder for crash, which tosses the pet already there), NVH shakes K out
     of line and the two pets on U wind up and push it back, lead does a hop
     with the tick, and each pet does one small thing once seated (acts).
     The clocks stop by n00.play.stop.still_s. The letters move by a
     transform on their <b>, set at each t by the module. */

  .name {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--name-y);
    margin: 0;
    text-align: center;
    font: 400 var(--name-size-px) / 1 var(--font-latin);
    letter-spacing: 0.3em;
    padding-left: 0.3em; /* balance the tracking after the last letter */
    color: var(--ink);
  }
  .name span {
    display: inline-block;
    animation: letter-in var(--name-in-dur) cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--t-name) + var(--i) * var(--name-in-step));
  }
  /* the letter itself, moved by the pets' play (n00.play) about the bottom
     centre of its line box; the span around it does the letter-in */
  .name b {
    display: inline-block;
    font-weight: inherit;
    transform-origin: 50% 100%;
  }
  @keyframes letter-in {
    from { opacity: 0; transform: translateY(calc(28 * var(--u))); }
    to   { opacity: 1; transform: none; }
  }

  .rule {
    position: absolute;
    left: var(--rule-x);
    width: var(--rule-w);
    top: var(--rule-y);
    height: var(--rule-h);
    background: var(--ink);
    transform-origin: 50% 50%;
    animation: rule-in 0.6s ease-out both;
    animation-delay: calc(var(--t-name) + 0.55s);
  }
  @keyframes rule-in {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  .tagline {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--tagline-y);
    margin: 0;
    text-align: center;
    font: 500 var(--tagline-size-px) / 1.3 var(--font-ja);
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    white-space: nowrap;
    animation: fade-in 0.6s ease-out both;
    animation-delay: var(--t-tagline);
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* the domain pets and their chips rise as one row (one thing in motion, not
     seven) */
  .row {
    position: absolute;
    inset: 0;
    pointer-events: none;
    animation: agent-in 0.5s ease-out both;
    animation-delay: var(--t-row);
  }
  @keyframes agent-in {
    from { opacity: 0; transform: translateY(calc(16 * var(--u))); }
    to   { opacity: 1; transform: none; }
  }
  .pet { position: absolute; display: block; }
  /* the pets: one layer behind the name (a pet there peeks out from behind
     a letter and never covers it) and one in front of everything */
  .pets { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .pets.front { z-index: 1; }

  .chip {
    position: absolute;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    background: var(--paper);
  }
  .chip {
    gap: calc(8 * var(--u));
    height: var(--chip-h);
    padding: 0 calc(20 * var(--u)) 0 calc(16 * var(--u));
    border-radius: calc(23 * var(--u));
    border: calc(2.5 * var(--u)) solid var(--ink-faint);
    font: 700 var(--chip-size-px) / 1 var(--font-ja);
    color: var(--ink-faint);
    animation: chip-on 0.35s ease-out both;
    animation-delay: calc(var(--t-light) + var(--i) * var(--t-step));
  }
  .chip i {
    width: calc(14 * var(--u));
    height: calc(14 * var(--u));
    border-radius: 50%;
    background: var(--ink-faint);
    animation: dot-on 0.35s ease-out both;
    animation-delay: inherit;
  }
  @keyframes chip-on {
    from { border-color: var(--ink-faint); color: var(--ink-faint); }
    to   { border-color: var(--pass); color: var(--ink); }
  }
  @keyframes dot-on {
    0%   { background: var(--ink-faint); transform: scale(1); }
    50%  { background: var(--pass); transform: scale(1.5); }
    100% { background: var(--pass); transform: scale(1); }
  }
</style>
</head>
<body data-duration="8.6">
<div class="stage paper-grid">
  <div class="safe">
    <div class="pets behind"></div>
    <h1 class="name" aria-label="HIRAKU" data-box="n00.name"></h1>
    <div class="rule" data-box="n00.rule"></div>
    <p class="tagline" data-box="n00.tagline"></p>
    <div class="row"></div>
    <div class="pets front"></div>
  </div>
  <div class="guide-band"></div>
  <div class="clock"></div>
</div>
<script>
  // The ten pets in pet3d.js ROLES order. Lead, designer and packager (tag:
  // the role's name, for the canvas's aria-label) sit on the name from the
  // start; the seven CAE domains carry the chip that lights (in this order).
  const PETS = [
    { id: "lead", tag: "まとめ役" },
    { id: "designer", tag: "設計役" },
    { id: "packager", tag: "パッケージ役" },
    { id: "cae.handling", chip: "操安" },
    { id: "cae.powertrain", chip: "動力" },
    { id: "cae.aero", chip: "空力" },
    { id: "cae.crash", chip: "衝突" },
    { id: "cae.strength", chip: "強度信頼性" },
    { id: "cae.nvh", chip: "音振" },
    { id: "cae.thermal", chip: "熱" },
  ];
  (function place() {
    const { cutRules: R, rules: L, px } = window.promoLayout;
    const P = R.pets;
    const span = 6 * P.pitch_px + P.w;
    const x0 = L.stage.w / 2 - span / 2;
    let k = 0;
    PETS.forEach((p) => {
      p.key = p.id.replace(/^cae\./, "");
      p.cast = R.cast[p.id];
      if (!p.cast) throw new Error(`n00: no cast entry for ${p.id}`);
      if (p.chip) {
        p.k = k++;
        p.x = x0 + p.k * P.pitch_px;   // the row spot (top-left, design px)
        p.cx = p.x + P.w / 2;
      }
    });
    window.N00_PETS = { list: PETS, x0, span };

    document.querySelector(".name").innerHTML = [..."HIRAKU"]
      .map((c, i) => `<span style="--i:${i}"><b>${c}</b></span>`).join("");
    document.querySelector(".tagline").textContent = R.tagline.text;
    // one 2D canvas per pet (the module copies the pet's WebGL frame into it
    // and places the canvas at each t), in the layer of its cast entry.
    // data-kind="moving": the layout check cannot see a canvas moving, and
    // every pet breathes until the clocks stop, so each counts
    const canvas = (p) =>
      `<canvas class="pet" data-box="n00.pet.${p.key}" data-kind="moving" data-pet="${p.id}"
          data-layer="${p.cast.layer || "front"}"${p.tag ? ` aria-label="${p.tag}"` : ""}></canvas>`;
    for (const layer of ["behind", "front"])
      document.querySelector(`.pets.${layer}`).innerHTML =
        PETS.filter((p) => (p.cast.layer || "front") === layer).map(canvas).join("");
    const below = P.y + P.h;
    document.querySelector(".row").innerHTML = PETS.filter((p) => p.chip).map((p) =>
      `<div class="chip" style="--i:${p.k};left:${px(p.cx)};top:${px(below + R.chip.gap_above_px)}"
           data-box="n00.chip.${p.key}" data-kind="label"><i></i>${p.chip}</div>`).join("");
  })();
</script>
<script src="timeline.js"></script>
<script>
  // Frames wait until the 3D pets have been built (the module below loads
  // three.js); a seek before that would paint an empty row.
  (function () {
    let done;
    const built = new Promise((r) => (done = r));
    window.__n00Built = done;
    const base = window.promo.ready.bind(window.promo);
    window.promo.ready = async () => { await base(); await built; };
  })();
</script>
<script src="../pets/pet3d.js"></script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const HP = window.HirakuPets;
const { cutRules: R, rules: L } = window.promoLayout;
const { list: PETS } = window.N00_PETS;
const P = R.pets, CAM = R.camera, M = R.motion, T = R.times, TP = R.title_pets;

// ---- one WebGL renderer off the page; each pet is drawn alone into it and
// copied into that pet's own 2D canvas. Transparent, so the paper grid shows
// through.
for (const p of PETS) p.box = document.querySelector(`canvas[data-pet="${p.id}"]`);
const stageW = document.querySelector(".stage").getBoundingClientRect().width;
const uCss = stageW / L.stage.w;
const dpr = window.devicePixelRatio || 1;
const devPx = uCss * dpr;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
// sizes in device pixels (pixel ratio 1); draw() sets the size of each pet's box
renderer.setPixelRatio(1);
renderer.setSize(Math.round(P.w * devPx), Math.round(P.h * devPx), false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const gl = renderer.domElement;

// ---- scene and light: the paper setting of promo/pets/viewer.html ----------
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.add(new THREE.HemisphereLight(0xfffaf0, 0xd8d2c4, 0.6));
const key = new THREE.DirectionalLight(0xfff6e8, 2.1);
key.position.set(-2.2, 8.0, 3.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.6, right: 2.6, top: 3.6, bottom: -1.6, near: 1, far: 16 });
key.shadow.radius = 8;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
key.target.position.set(0.2, 1.0, 0);
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.3);
rim.position.set(3.5, 3.0, -4.5);
scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ color: 0x1b1a17, opacity: 0.13 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---- one camera for every box (all boxes have the aspect of n00.pets) -------
const F = HP.FRAME;
const half = Math.tan((CAM.fov_deg * Math.PI) / 360);
const aspect = P.w / P.h;
const dist = Math.max(F.h / 2 / half, F.w / 2 / (half * aspect)) * 1.04 + 0.6;
const cam = new THREE.PerspectiveCamera(CAM.fov_deg, aspect, 0.1, 80);
const az = (CAM.azimuth_deg * Math.PI) / 180, el = (CAM.elevation_deg * Math.PI) / 180;
const home = new THREE.Vector3(F.cx, F.cy, 0);
cam.position.set(home.x + dist * Math.sin(az) * Math.cos(el), home.y + dist * Math.sin(el),
                 dist * Math.cos(az) * Math.cos(el));
cam.lookAt(home);
cam.updateMatrixWorld();
// where the pet's feet (its origin) fall in a box, as fractions of its w and h
const foot = new THREE.Vector3(0, 0, 0).project(cam);
const FOOT = { fx: (foot.x + 1) / 2, fy: (1 - foot.y) / 2 };

// The heading on the screen of a pet turned by yaw (its front is +z): the
// screen px a step of one pet unit along it moves the feet, in a box 1 px
// high (camera projection of a short step from the feet).
function headingPx(yaw) {
  const e = 0.05;
  const v = new THREE.Vector3(e * Math.sin(yaw), 0, e * Math.cos(yaw)).project(cam);
  return { x: ((v.x - foot.x) / 2) * aspect / e, y: (-(v.y - foot.y) / 2) / e };
}
// the yaw whose heading on the screen points along (dx, dy), to 0.1 degree,
// and the px per pet unit along it for a box h high (walks: the steps cover
// the ground the box moves over)
const HEAD = [];
for (let i = 0; i < 3600; i++) { const y = ((i / 10 - 180) * Math.PI) / 180; HEAD.push([y, headingPx(y)]); }
function yawTo(dx, dy, h) {
  let best = HEAD[0], bc = -2;
  for (const e of HEAD) {
    const n = Math.hypot(e[1].x, e[1].y), c = (e[1].x * dx + e[1].y * dy) / n;
    if (c > bc) { bc = c; best = e; }
  }
  return { yaw: best[0], px: Math.hypot(best[1].x, best[1].y) * h };
}

// ---- the letters (seats on the name: layout.json n00.title_pets) ------------
// Each letter's ink box is measured in the name's font (canvas measureText);
// its left edge comes from the letter's own span. All in design px.
await document.fonts.ready;
function letterInk() {
  const name = document.querySelector(".name");
  const cs = getComputedStyle(name);
  const size = R.name.size_px;
  const c2 = document.createElement("canvas").getContext("2d");
  c2.font = `${cs.fontStyle} ${cs.fontWeight} ${size}px ${cs.fontFamily}`;
  const stage = document.querySelector(".stage").getBoundingClientRect();
  const mH = c2.measureText("H");
  // line-height 1: the content box (font ascent + descent) is centred on the line
  const baseline = R.name.y + (size - (mH.fontBoundingBoxAscent + mH.fontBoundingBoxDescent)) / 2
                   + mH.fontBoundingBoxAscent;
  return [...name.querySelectorAll("span")].map((s) => {
    const m = c2.measureText(s.textContent);
    const left = (s.getBoundingClientRect().left - stage.left) / uCss;   // the glyph's origin
    // the play's origin for this letter: the bottom centre of its <b> line box
    const b = s.firstElementChild;
    const br = b.getBoundingClientRect();
    return { x0: left - m.actualBoundingBoxLeft, x1: left + m.actualBoundingBoxRight,
             top: baseline - m.actualBoundingBoxAscent, bottom: baseline + m.actualBoundingBoxDescent, el: b,
             ox: (br.left + br.width / 2 - stage.left) / uCss,
             oy: R.name.y + (b.offsetTop + b.offsetHeight) / uCss };
  });
}
const INK = letterInk();
const seatH = TP.h_em * R.name.size_px;
const SEAT = { h: seatH, w: (seatH * P.w) / P.h };

// ---- the play with the letters (layout.json n00.play) ------------------------
// Every function here is of t alone. A letter's move is {dx, dy, rot, sx, sy}
// (design px, radians), applied to its <b> about its bottom centre (ox, oy).
const PL = R.play;
const A = HP.anim;
const smooth = A.smooth;
const rad = (d) => (d * Math.PI) / 180;
// the sink and come back: d(u) = sin(3 pi u) (1 - u)^2, scaled to a peak of 1
const BOUNCE = (() => {
  let m = 0;
  for (let i = 1; i < 400; i++) { const u = i / 400; m = Math.max(m, Math.sin(3 * Math.PI * u) * (1 - u) ** 2); }
  return m;
})();
const bounce = (u) => (u <= 0 || u >= 1 ? 0 : (Math.sin(3 * Math.PI * u) * (1 - u) ** 2) / BOUNCE);
const SH = PL.shake, PU = PL.push, ST = PL.stop;
// [letter, start, dur, sink, squash] for every landing on a letter: each hop
// in a cast route that ends on a seat (filled below)
const LANDS = [];

// how far K is out of line (1 = as shaken out, 0 = in line): out with an
// overshoot while it shakes, back with an overshoot when it is pushed
function kOut(t) {
  if (t < SH.start_s) return 0;
  const k0 = PU.start_s + PU.letter_from * PU.dur_s;
  if (t < k0) return A.back((t - SH.start_s) / SH.dur_s, SH.over);
  return 1 - A.back((t - k0) / (PU.start_s + PU.dur_s - k0), PU.letter_over);
}
function letterMove(i, t) {
  const m = { dx: 0, dy: 0, rot: 0, sx: 1, sy: 1 };
  if (t < PL.from_s || t >= PL.still_s) return m;
  for (const [k, t0, dur, sink, sq] of LANDS) {
    if (k !== i) continue;
    const d = bounce((t - t0) / dur);
    m.dy += sink * d;
    m.sy -= sq * d;
    m.sx += 0.5 * sq * d;
  }
  if (i === SH.letter) {
    const u = (t - SH.start_s) / SH.dur_s;
    const out = kOut(t);
    const shake = u > 0 && u < 1 ? rad(SH.rot_deg) * Math.sin(2 * Math.PI * SH.hz * (t - SH.start_s)) * (1 - u) : 0;
    m.dx += SH.dx_px * out;
    m.rot += rad(SH.tilt_deg) * out + shake;
  }
  return m;
}
// where the point (x, y) of letter i is at t (CSS: translate, rotate, scale
// about the origin)
function onLetter(i, t, x, y) {
  const m = letterMove(i, t), o = INK[i];
  const ax = (x - o.ox) * m.sx, ay = (y - o.oy) * m.sy;
  const c = Math.cos(m.rot), s = Math.sin(m.rot);
  return { x: o.ox + m.dx + c * ax - s * ay, y: o.oy + m.dy + s * ax + c * ay, rot: m.rot };
}
// a pusher's lean (0..1 of lean_deg; negative: wound back) and step (0..1 of
// step_px; negative: back to the right) at t: wind up, shove (ease out), hold,
// and back with an overshoot
function pushShape(P, k, t) {
  const t0 = P.start_s + P.lag_s[k];
  const w = (t - (t0 - P.wind_s)) / P.wind_s;
  const u = (t - t0) / P.dur_s;
  const wind = { lean: -P.wind_deg / P.lean_deg, step: -P.wind_px / P.step_px[k] };
  if (u >= 1 || w <= 0) return { lean: 0, step: 0 };
  if (u < 0) { const s = smooth(w); return { lean: wind.lean * s, step: wind.step * s }; }
  if (u < P.push_in) {
    const s = A.out(u / P.push_in);
    return { lean: wind.lean + (1 - wind.lean) * s, step: wind.step + (1 - wind.step) * s };
  }
  if (u < P.hold_to) return { lean: 1, step: 1 };
  const s = 1 - A.back((u - P.hold_to) / (1 - P.hold_to), P.over);
  return { lean: s, step: s };
}

// ---- places and routes (layout.json n00.cast) --------------------------------
// A place is [x, y] (the feet, design px), {row: k} (the feet in row spot k:
// the domain pets' places over their chips, k may be between two), or
// {seat: letter, at} (on the top edge of that letter at at across its ink,
// riding the letter's play).
function place(at, t) {
  if (Array.isArray(at)) return { x: at[0], y: at[1] };
  if (at.row !== undefined) {
    const x0 = window.N00_PETS.x0;
    return { x: x0 + at.row * P.pitch_px + FOOT.fx * P.w, y: P.y + FOOT.fy * P.h };
  }
  const o = INK[at.seat];
  return onLetter(at.seat, t, o.x0 + at.at * (o.x1 - o.x0), o.top - TP.lift_px);
}
const CTX = { place, yawTo };
// the row comes in at times.row_s as the chips do (CSS agent-in: 0.5 s,
// ease-out = cubic-bezier(0, 0, 0.58, 1), from 16 px lower and transparent)
function bezier(x1, y1, x2, y2, x) {
  const f = (a, b, s) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (f(x1, x2, m) < x) lo = m; else hi = m; }
  return f(y1, y2, (lo + hi) / 2);
}
function rowIn(t) {
  const u = (t - T.row_s) / 0.5;
  return u <= 0 ? 0 : u >= 1 ? 1 : bezier(0, 0, 0.58, 1, u);
}
PETS.forEach((p, i) => {
  p.pet = HP.create(THREE, { role: p.id, theme: "paper" });
  p.pet.group.visible = false;
  scene.add(p.pet.group);
  p.ctx = p.box.getContext("2d");
  p.shift = M.idle_shift_s * i;
  p.start = Object.assign({ h: SEAT.h }, p.cast.start);
  if (p.start.h === "row") p.start.h = P.h;
  // hops: n00.play.hop with the beat's own values on top
  p.beats = p.cast.beats.map((b) => Object.assign({}, b.do === "hop" || b.do === "hops" ? PL.hop : {}, b,
                                                  b.h === "seat" ? { h: SEAT.h } : {}));
  p.inRow = !Array.isArray(p.start.at) && p.start.at.row !== undefined;
  // a landing on a letter sinks it by the pet's weight
  for (const b of p.beats)
    if (b.do === "hop" && b.to.seat !== undefined) {
      const w = b.weight ?? 1;
      LANDS.push([b.to.seat, b.t + A.hop(0, b).land, PL.land.dur_s, PL.land.sink_px * w, PL.land.squash * w]);
    }
});

// The box of pet p at t: {x, y, w, h (design px), yaw, roll, alpha, pose}.
function placeAt(p, t) {
  const r = A.route(t, p.start, p.beats, CTX);
  // riding a letter: lean with it
  if (!Array.isArray(r.at) && r.at.seat !== undefined && !r.air) r.roll -= letterMove(r.at.seat, t).rot;
  const k = PU.roles.indexOf(p.id);
  if (k >= 0) {
    const s = pushShape(PU, k, t);
    r.x -= PU.step_px[k] * s.step;
    r.roll += rad(PU.lean_deg) * s.lean;
  }
  let alpha = r.alpha;
  if (p.inRow && r.at.row !== undefined) {
    const e = rowIn(t);
    r.y += 16 * (1 - e);
    alpha *= e;
  }
  const h = r.h, w = (h * P.w) / P.h;
  r.pose.check = r.check;
  return { x: r.x - FOOT.fx * w, y: r.y - FOOT.fy * h, w, h, foot: { x: r.x, y: r.y },
           yaw: r.yaw, roll: r.roll, alpha, pose: r.pose };
}
// the pets' clock: t, slowing to a halt from stop.from_s to stop.still_s (so
// the breathing and blinking stop too)
function clock(t) {
  const a = ST.from_s, d = ST.still_s - ST.from_s;
  if (t <= a) return t;
  const s = Math.min(t - a, d);
  return a + s - (s * s) / (2 * d);
}

// Each canvas is placed on whole device pixels and holds as many pixels as it
// shows. The renderer is set to that size and the pet drawn at it (lines and
// node dots for that size), and the frame is copied 1:1, with no scaling by
// CSS or drawImage. In each layer the pet whose feet are lower is in front.
function draw(t) {
  INK.forEach((o, i) => {
    const m = letterMove(i, t);
    const still = !m.dx && !m.dy && !m.rot && m.sx === 1 && m.sy === 1;
    o.el.style.transform = still ? "" : `translate(${(m.dx * uCss).toFixed(3)}px, ${(m.dy * uCss).toFixed(3)}px) ` +
      `rotate(${m.rot.toFixed(5)}rad) scale(${m.sx.toFixed(5)}, ${m.sy.toFixed(5)})`;
  });
  const c = clock(t);
  for (const p of PETS) {
    const b = placeAt(p, t);
    const x = Math.round(b.x * devPx), y = Math.round(b.y * devPx);
    const w = Math.round(b.w * devPx), h = Math.round(b.h * devPx);
    if (p.box.width !== w || p.box.height !== h) {
      p.box.width = w;
      p.box.height = h;
    }
    const st = p.box.style;
    st.left = `${x / dpr}px`; st.top = `${y / dpr}px`; st.width = `${w / dpr}px`; st.height = `${h / dpr}px`;
    st.opacity = b.alpha >= 1 ? "" : b.alpha.toFixed(4);
    st.zIndex = String(Math.round(b.foot.y * 10));
    if (t < ST.still_s) p.box.dataset.kind = "moving"; else delete p.box.dataset.kind;
    if (b.alpha <= 0) { p.ctx.clearRect(0, 0, w, h); continue; }
    if (gl.width !== w || gl.height !== h) renderer.setSize(w, h, false);
    p.pet.setPixelScale(h / (2 * dist * half));
    // roll about the feet after the yaw (rotation order Z, Y, X)
    p.pet.group.rotation.set(0, b.yaw, b.roll || 0, "ZYX");
    p.pet.group.visible = true;
    p.pet.update(c + p.shift, "idle", cam, b.pose);
    renderer.render(scene, cam);
    p.pet.group.visible = false;
    p.ctx.clearRect(0, 0, w, h);
    p.ctx.drawImage(gl, 0, 0);
  }
}

window.N00_SEATS = { INK, SEAT, FOOT, placeAt, letterMove, clock, LANDS, place, yawTo };
window.promo.onSeek(draw);
draw(window.promo.t);
window.__n00Built();
</script>
