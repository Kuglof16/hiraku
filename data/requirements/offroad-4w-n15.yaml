# Requirements for video scene N15: the demo vehicle (the same want, flags and requirement
# values as data/requirements/offroad-4w-video.yaml and data/requirements/offroad-4w.yaml) with
# the video file's tests, R1s included, and no cases past the limit. The scripted plan
# offroad-4w-n15 in data/catalog/scripted.yaml revises the design round by round until every
# tile is green on the last version (tests/agent/test_scene_n15.py checks it).
# Shape: hiraku.contract "requirements_file". Sources are written in `basis`.
# "not checked in this repository" = the value is taken from the cited page,
# and that page has not been read again for this repository.
# "assumption" = an engineering assumption with no public source (trust 3).
# trust and "not checked" are different things: trust is the kind of source
# (1 primary, 2 secondary, 3 assumption); "not checked" says whether the value
# has been read again against that source.

want: 林道を走れる 2 人乗りの小さなオフロード車両 (4 輪、最高 40 km/h、積載 150 kg)
product: offroad-4w
speed_class: vehicle
flags:
  ride: true            # 乗: people ride on it
  lean: true            # 預: people sit on the seat
  self_propelled: true  # 走
  outdoor: true         # 外
  rough: true           # 悪: unpaved forest roads
  public_road: false    # 公: Q70 is a required question; this file assumes private land only (not asked)
  battery: true         # 池
  electric: true        # 電
  pinch: true           # 挟: suspension gaps
  cargo: true           # 荷
  standing: true        # 置
  vibration: true       # 振: wheels and motor rotate
  continuous: true      # 続
  assembly: true        # 組
requirements:
  - key: Q11
    name: 路面の摩擦係数 (砂利)
    value: 0.6
    unit: "1"
    source: default
    trust: 3
    basis: assumption (gravel; no public value found)
  - key: Q12
    name: 路面の粗さ (ISO 8608 のクラス)
    value: C
    source: default
    trust: 3
    basis: >-
      assumption: the forest road taken as ISO 8608 class C. ISO 8608 covers unpaved roads too
      (https://www.iso.org/standard/71202.html); class C = 128-512 x 10^-6 m^3 at n0 = 0.1 cycle/m from the
      table in https://link.springer.com/article/10.1007/s12544-013-0127-8 (not checked in this repository)
  - key: Q13
    name: 縦の坂 (止まって発進できる一番急な坂)
    value: 14
    unit: "%"
    source: default
    trust: 1
    basis: >-
      林道規程 (林野庁) 第 20 条: 縦断勾配 12 % は第 1 項のただし書、14 % は第 4 項の 2 級林道の例外
      (the steepest stretch),
      https://www.rinya.maff.go.jp/hokkaido/keikaku/other/attach/pdf/sinrinkeikaku_taikei-32.pdf
      (the article and its paragraphs read for this repository). The sustained 12 % is the forest
      loop's grade_high in data/catalog/tests.yaml (P4, T1, T2)
  - key: Q14
    name: 横の傾き
    value: 15
    unit: deg
    source: default
    trust: 3
    basis: assumption (no basis found)
  - key: Q15
    name: 段差
    value: 100
    unit: mm
    source: default
    trust: 3
    basis: assumption
  - key: Q18
    name: 横風 (瞬間)
    value: 30
    unit: m/s
    source: default
    trust: 1
    basis: >-
      気象庁「風の強さと吹き方」https://www.jma.go.jp/jma/kishou/know/yougo_hp/kazehyo.html (the table is an image,
      kazehyo.png and kazehyo.pdf): 平均風速 20 m/s is where 「非常に強い風」 begins; 注 2: the gust is often about
      1.5 times the mean wind (3 times or more when the air is unstable). So a gust of 30 m/s (1.5 x 20 m/s)
      (read 2026-11-05)
  - key: Q19
    name: 気温 (範囲の高い端)
    value: 40
    unit: degC
    source: default
    trust: 3
    basis: assumption (the hot end of a -10 to 40 degC range of use)
  - key: Q30
    name: 人数と荷重の組 (見る組)
    value: two_cargo
    source: user
    trust: 1
    basis: request (2 人乗り、積載 150 kg)
    note: MVP は two_cargo (2 人 + 荷) だけを見る。empty・driver・two はまだ見ない。乗員と荷は設計の部品 (kind occupant / cargo)
  - key: Q31
    name: 体格の範囲
    value: 若年女性 5 % 〜 若年男性 95 %
    source: default
    trust: 1
    basis: AIST 人体寸法データベース 1991-92, https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (not checked in this repository)
  - key: Q33
    name: 体重 (強さの不利側)
    value: 76.6
    unit: kg
    source: default
    trust: 1
    basis: >-
      AIST 人体寸法データベース 1991-92, 項目 N1 体重, 若年男性 95 パーセンタイル,
      https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (read against the table, 2026-11-03)
  - key: Q40
    name: 積載
    value: 150
    unit: kg
    source: user
    trust: 1
    basis: request
    note: 乗員とは別の荷として扱う (聞いていない)
  - key: Q41
    name: 荷の重心の高さ (荷台の床から)
    value: 150
    unit: mm
    source: default
    trust: 1
    basis: >-
      the demo design's cargo: its box centre at 600 mm stands 150 mm above the deck's top at 450 mm
      (data/designs/offroad-4w-v1.json, parts cargo and deck)
  - key: Q50
    name: 最高速度
    value: 40
    unit: km/h
    source: user
    trust: 1
    basis: request
  - key: Q51
    name: 0 → 最高速度の時間
    value: 6
    unit: s
    source: default
    trust: 3
    basis: assumption
  - key: Q52
    name: 停止距離
    value: 14
    unit: m
    source: default
    trust: 3
    basis: >-
      assumption: borrowed from 細目告示 第171条 第5項 第3号's table, https://www.mlit.go.jp/jidosha/content/S171.pdf
      (the 2021.6.9 text): the row for a maximum speed of 35 km/h or more and under 80 km/h (initial speed 35 km/h,
      stopping distance 14 m or less), a borrowing and not a row for this vehicle's kind (the same table's row for
      20 km/h or more and under 35 km/h: initial speed 20 km/h, 5 m or less) (read 2026-11-05)
  - key: Q53
    name: 止まっていられる坂
    value: 20
    unit: "%"
    source: default
    trust: 3
    basis: >-
      assumption: borrowed from 細目告示 第171条 第5項 第5号, https://www.mlit.go.jp/jidosha/content/S171.pdf
      (the 2021.6.9 text): 「5 分の 1 こう配」 (20 %), not a requirement for this vehicle's kind (read 2026-11-05)
  - key: Q54
    name: 航続
    value: 20
    unit: km
    source: default
    trust: 3
    basis: assumption
  - key: Q60
    name: 倒れない角度 (Q30 の組で)
    value: 24
    unit: deg
    source: default
    trust: 1
    basis: >-
      fully loaded (two_cargo, as Q30): 24 deg from ROHVA 1 and ANSI B71.9 as summarized in the CPSC staff
      briefing of 2016-11-22 (PDF p.11), which also gives 33 deg for two people (both read on that page for
      this repository); 35 deg empty: an assumption (no source found)
  - key: Q61
    name: 安全率 (降伏に対して)
    value: 1.5
    unit: "1"
    source: default
    trust: 3
    basis: assumption
  - key: Q65
    name: 衝突の速さ
    value: 40
    unit: km/h
    source: default
    trust: 3
    basis: assumption (the top speed, Q50)
  - key: Q70
    name: 公道を走るか
    value: 私有地 (林道) だけ
    source: default
    trust: 3
    basis: assumption of this fixed file; Q70 is a required question and was not asked
  - key: Q82
    name: 出荷の形
    value: 完成車
    source: default
    trust: 3
    basis: assumption
  - key: Q90
    name: 悪路の走行距離 (疲労)
    value: 5000
    unit: km
    source: default
    trust: 3
    basis: assumption (no public basis found)
# Every test that applies to the flags and has a load-case builder (the video file's list);
# each has a scripted step. P1, S5 and N1 have no criterion: they are compared but not judged.
  # functional requirements of the off-road vehicle (the intake department's list FN-01..FN-19, 2026-11-03):
  # what the vehicle must do, with its load and range; the tests R7, R8, C3 and H6 judge them
  - key: Q66
    name: 手の操作部に掛かる力 (握る点、前後・上下・回す向きのそれぞれ)
    value: 300
    unit: N
    source: default
    trust: 3
    basis: >-
      assumption: UN Regulation No. 79 (1988 text), table "Steering control effort requirements" (M1, with a
      failure: 300 N) taken as the largest hand force in use (the table was read; using it as a design load is
      the assumption)
  - key: Q67
    name: 手の操作部の握る点の動きの上限 (Q66 の力で)
    value: 5
    unit: mm
    source: default
    trust: 3
    basis: assumption (the range where the feel and position of the control do not change; no source)
  - key: Q68
    name: 足の操作部に掛かる力 (踏む面、踏む向き)
    value: 500
    unit: N
    source: default
    trust: 1
    basis: >-
      UN Regulation No. 13-H, Annex 3, 2.1.1 and 2.3.4 (50 daN, read by the intake department on 2026-11-03)
  - key: Q69
    name: 足の操作部の踏む面の支えの動きの上限 (Q68 の力で)
    value: 5
    unit: mm
    source: default
    trust: 3
    basis: assumption (small against the control's travel; no source)
  - key: Q75
    name: 乗員と部品に掛かる横の加速度
    value: 0.70
    unit: g
    source: default
    trust: 1
    basis: >-
      CPSC NPR 79 FR 68964, § 1422.3(e) (0.70 g; read by the intake department on 2026-11-03). The vehicle's own
      peak from its dynamics tests counts instead when it is larger
  - key: Q76
    name: 乗員と部品に掛かる前後の加速度
    value: 0.90
    unit: g
    source: default
    trust: 1
    basis: >-
      CPSC NPR 79 FR 68964, § 1422.3(b)(1) (peak braking coefficient 0.90; read by the intake department on
      2026-11-03). The vehicle's own peak counts instead when it is larger
  - key: Q77
    name: 乗員の肩・腰の位置 (点 R) を外へ押す力 (10 s)
    value: 725
    unit: N
    source: default
    trust: 1
    basis: CPSC NPR 79 FR 68964, § 1422.5(c)(1)-(5) (read by the intake department on 2026-11-03)
  - key: Q78
    name: Q77 の力を除いたあとの点 R の永久の横の変形の上限
    value: 25
    unit: mm
    source: default
    trust: 1
    basis: CPSC NPR 79 FR 68964, § 1422.5(c) (less than 25 mm; read by the intake department on 2026-11-03)
  - key: Q86
    name: 乗員の空間の荷重の基準の質量 M (横 1.75 M J・後ろ 1.4 M J・上 20 M N)
    value: 500
    unit: kg
    source: default
    trust: 3
    basis: >-
      assumption (the R4 builder's M). The coefficients 1.75, 1.4 and 20 are OECD Standard Code 4 (February 2026),
      3.5.2.1, 3.5.3.1, 3.6.1 (read), borrowed from tractors >= 600 kg; they stay in the R4 builder, the contract
      having no unit J/kg or N/kg for them
  - key: Q87
    name: 泥や石を放す踏面の範囲 (車軸の真上から前へ)
    value: 30
    unit: deg
    source: default
    trust: 3
    basis: >-
      道路運送車両の保安基準の細目を定める告示 (2023.9.22 版) 第178条 第2項 第1号 (read); a public-road rule for
      other traffic, borrowed: applying it to the occupants is an assumption
  - key: Q88
    name: 泥や石を放す踏面の範囲 (車軸の真上から後ろへ)
    value: 50
    unit: deg
    source: default
    trust: 3
    basis: >-
      the same 第178条 第2項 第1号 (read; borrowed, an assumption as Q87). The tread above the axle beyond this
      arc counts too (assumption)
  - key: Q93
    name: 乗り降りの開口の前後の幅 (座面より上で、人の胴が通る部分の最小)
    value: 450
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 4252:1983 Figure 1 (450 mm min at 1 000 mm above the door sill, 470 mm min at 1 250 mm) and ISO 2867:1980 10.1
      (450 mm min from 770 to 1 550 mm above the platform, 680 mm recommended), read 2026-11-04. Both are an older edition of
      a standard for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard
      for a small open off-road vehicle could be read). The current ISO 4252:2007 and ISO 2867:2011 were not checked'
  - key: Q94
    name: 乗り降りの開口の前後の幅 (床から座面の高さまでの、足と脚が通る部分の最小)
    value: 300
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 2867:1980 10.1 (300 mm min from the platform up to 770 mm), read 2026-11-04; ISO 4252:1983 Figure 1 gives 250
      mm min for the lower part (the larger is kept), read 2026-11-04. Both are an older edition of a standard for agricultural
      tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle
      could be read)'
  - key: Q95
    name: 乗り降りの開口の高さ (座面の面から上へ、ふさいではいけない最小)
    value: 985.2
    unit: mm
    source: default
    trust: 3
    basis: 'assumption: H = AIST 人体寸法データベース 1991-92, I1 座高 (seat surface to vertex), young adults, men, 95 percentile = 985.2
      mm (N 217), read 2026-11-04 in the table. No standard read gives a height above the seat surface'
  - key: Q96
    name: 乗り降りの開口の高さ (床・敷居から上へ、ふさいではいけない最小)
    value: 1250
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 4252:1983 Figure 1 (1 250 mm min above the door sill; its NOTE lets the measuring heights be lowered where the
      seat is reached straight from the footstep), read 2026-11-04; ISO 2867:1980 10.2 recommends 1 300 mm or more from the
      floor in sit-down cabs, read 2026-11-04. Both are an older edition of a standard for agricultural tractors or earth-moving
      machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle could be read)'
  - key: Q97
    name: 地面から最初の足を置く面 (床の上面か最初の段) までの高さの上限
    value: 550
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 4252:1983 Table 1 (first step from level ground max 550 mm, widest normally inflated tyres included), read 2026-11-04;
      ISO 2867:1994 Table 1 A (max 700 mm, basic 400 mm), read 2026-11-04. The smaller maximum is kept. Both are an older edition
      of a standard for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard
      for a small open off-road vehicle could be read)'
  - key: Q44
    name: 足を置く面どうしの高さの差の上限 (段と段、最後の段から床まで)
    value: 300
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 4252:1983 Table 1 (between steps max 300 mm; last step to door sill max 300 mm), read 2026-11-04; ISO 2867:1994
      Table 1 B (riser 230 to 400 mm, basic 300 mm), read 2026-11-04. Both are an older edition of a standard for agricultural
      tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle
      could be read)'
  - key: Q45
    name: 足を置く面の幅の下限
    value: 150
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 4252:1983 Table 1 (width of step min 150 mm; footnote: for practical reasons not less than 250 mm), read 2026-11-04;
      ISO 2867:1994 Table 1 C (one foot 160 mm min, both feet 320 mm min), read 2026-11-04. Both are an older edition of a standard
      for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small
      open off-road vehicle could be read)'
  - key: Q46
    name: 足を置く面の外の縁から先の、つま先が入る空きの下限
    value: 150
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 4252:1983 Table 1 (clearance from the outside edge of the step min 150 mm), read 2026-11-04; ISO 2867:1994 Table
      1 F2 (toe clearance min 150 mm, basic 200 mm), read 2026-11-04. Both are an older edition of a standard for agricultural
      tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle
      could be read)'
  - key: Q47
    name: 開口を、乗る人が道具なしに片手・一つの動作で開けられること
    value: はい
    source: default
    trust: 3
    basis: 'assumption. CPSC NPR 79 FR 68964, preamble (occupant retention), read 2026-11-04, accepts a barrier the occupant
      puts in place with one hand in one operation, such as a door (said of closing; applied here to opening). 道路運送車両の保安基準 第25条第3項,
      read 2026-11-04: 鎖・ロープなど転落を防ぐ装置は扉の代わりになる. No force or time for opening was found'
  - key: Q48
    name: 乗り降りの手がかりの高さの上限 (足を置く面から上へ)
    value: 1600
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 2867:1980 7.8 (grab rails begin at max 1 600 mm above the ground or platform; continue to at least 900 mm above
      the last step), read 2026-11-04; ISO 2867:1994 Table 2 D, not checked here. an older edition of a standard for agricultural
      tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle
      could be read). Whether a hand hold is required at all for a floor below 1 m was not found in any source read (ISO 2867:1994
      4.7 asks for three-point support above 1 m)'
  - key: Q49
    name: 手でつかむ所の太さ (直径か平行な面の間) の下限
    value: 16
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 2867:1980 7.3 (grab rail or handle: 16 mm min, 25 mm recommended, 38 mm max), read 2026-11-04; ISO 2867:1994
      Table 2 A (16 mm min, 38 mm max, 25 mm basic), read 2026-11-04. Both are an older edition of a standard for agricultural
      tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle
      could be read)'
  - key: Q89
    name: 手でつかむ所の太さの上限
    value: 38
    unit: mm
    source: default
    trust: 3
    basis: 'ISO 2867:1980 7.3 (38 mm max) and ISO 2867:1994 Table 2 A (38 mm max), read 2026-11-04. Both are an older edition
      of a standard for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard
      for a small open off-road vehicle could be read)'
tests: [P1, R1, R1s, R3, S1, F1, S3, S4, S5, P2, P3, P4, T1, T2, C1, N1, R8, R7, H1, H3, H6, H7, H5]
# No cases past the limit: every tile of the last version is meant to be green.
design_file: data/designs/offroad-4w-v1.json
round_limit: 6  # HK5: one revision per red stage (layout, the opening, the controls, motor, joints) and one spare for a run with Claude (the scripted plan uses 5)
cost_limit_usd: 2.0
