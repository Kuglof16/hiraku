# Requirements for the video scene N14 (A5, knowledge to rules): the video run's
# want, flags and requirement values (data/requirements/offroad-4w-video.yaml) with two
# tests only. The scripted plan offroad-4w-n14 (data/catalog/scripted.yaml) drops a file of
# rules during the run; the rules are checked on the parts and the lead asks about the hit.
# Shape: hiraku.contract "requirements_file". Sources are written in `basis`.
# "not checked in this repository" = the value is taken from the cited page,
# and that page has not been read again for this repository.
# "assumption" = an engineering assumption with no public source (trust 3).
# trust and "not checked" are different things: trust is the kind of source
# (1 primary, 2 secondary, 3 assumption); "not checked" says whether the value
# has been read again against that source.

want: 林道を走れる 2 人乗りの小さなオフロード車両 (4 輪、最高 40 km/h、500 kg まで、積載 150 kg)
product: offroad-4w
speed_class: vehicle
flags:
  ride: true            # 乗: people ride on it
  lean: true            # 預: people sit on the seat
  self_propelled: true  # 走
  outdoor: true         # 外
  rough: true           # 悪: unpaved forest roads
  public_road: false    # 公: Q70 is a required question; this file assumes private land only (not asked)
  battery: true         # 池
  electric: true        # 電
  pinch: true           # 挟: suspension gaps
  cargo: true           # 荷
  standing: true        # 置
  vibration: true       # 振: wheels and motor rotate
  continuous: true      # 続
  assembly: true        # 組
requirements:
  - key: Q11
    name: 路面の摩擦係数 (砂利)
    value: 0.6
    unit: "1"
    source: default
    trust: 3
    basis: assumption (gravel; no public value found)
  - key: Q12
    name: 路面の粗さ (ISO 8608 のクラス)
    value: C
    source: default
    trust: 3
    basis: >-
      assumption: the forest road taken as ISO 8608 class C. ISO 8608 covers unpaved roads too
      (https://www.iso.org/standard/71202.html); class C = 128-512 x 10^-6 m^3 at n0 = 0.1 cycle/m from the
      table in https://link.springer.com/article/10.1007/s12544-013-0127-8 (not checked in this repository)
  - key: Q13
    name: 縦の坂 (止まって発進できる一番急な坂)
    value: 14
    unit: "%"
    source: default
    trust: 1
    basis: >-
      林道規程 (林野庁) 第 20 条: 縦断勾配 12 % は第 1 項のただし書、14 % は第 4 項の 2 級林道の例外
      (the steepest stretch),
      https://www.rinya.maff.go.jp/hokkaido/keikaku/other/attach/pdf/sinrinkeikaku_taikei-32.pdf
      (the article and its paragraphs read for this repository). The sustained 12 % is the forest
      loop's grade_high in data/catalog/tests.yaml (P4, T1, T2)
  - key: Q14
    name: 横の傾き
    value: 15
    unit: deg
    source: default
    trust: 3
    basis: assumption (no basis found)
  - key: Q15
    name: 段差
    value: 100
    unit: mm
    source: default
    trust: 3
    basis: assumption
  - key: Q18
    name: 横風 (瞬間)
    value: 30
    unit: m/s
    source: default
    trust: 1
    basis: 気象庁の風の強さの目安で、瞬間風速 30 m/s (平均風速では 20 m/s) とする (not checked in this repository)
  - key: Q19
    name: 気温 (範囲の高い端)
    value: 40
    unit: degC
    source: default
    trust: 3
    basis: assumption (the hot end of a -10 to 40 degC range of use)
  - key: Q30
    name: 人数と荷重の組 (見る組)
    value: two_cargo
    source: user
    trust: 1
    basis: request (2 人乗り、積載 150 kg)
    note: MVP は two_cargo (2 人 + 荷) だけを見る。empty・driver・two はまだ見ない。乗員と荷は設計の部品 (kind occupant / cargo)
  - key: Q31
    name: 体格の範囲
    value: 若年女性 5 % 〜 若年男性 95 %
    source: default
    trust: 1
    basis: AIST 人体寸法データベース 1991-92, https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (not checked in this repository)
  - key: Q33
    name: 体重 (強さの不利側)
    value: 76.6
    unit: kg
    source: default
    trust: 1
    basis: >-
      AIST 人体寸法データベース 1991-92, 項目 N1 体重, 若年男性 95 パーセンタイル,
      https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (read against the table, 2026-11-03)
  - key: Q40
    name: 積載
    value: 150
    unit: kg
    source: user
    trust: 1
    basis: request
    note: 乗員とは別の荷として扱う (聞いていない)
  - key: Q41
    name: 荷の重心の高さ (荷台の床から)
    value: 150
    unit: mm
    source: default
    trust: 1
    basis: >-
      the demo design's cargo: its box centre at 600 mm stands 150 mm above the deck's top at 450 mm
      (data/designs/offroad-4w-v1.json, parts cargo and deck)
  - key: Q50
    name: 最高速度
    value: 40
    unit: km/h
    source: user
    trust: 1
    basis: request
  - key: Q51
    name: 0 → 最高速度 (Q50) の時間
    value: 6
    unit: s
    source: default
    trust: 3
    basis: assumption
  - key: Q52
    name: 停止距離
    value: 14
    unit: m
    source: default
    trust: 3
    basis: >-
      assumption: borrowed from 細目告示 第171条 第5項 (初速 35 km/h), https://www.mlit.go.jp/jidosha/content/S171.pdf;
      the table is for vehicles of 25 km/h or less and others, not for this vehicle's class
      (not checked in this repository)
  - key: Q53
    name: 止まっていられる坂
    value: 20
    unit: "%"
    source: default
    trust: 3
    basis: >-
      assumption: borrowed from 細目告示 第171条 第5項, https://www.mlit.go.jp/jidosha/content/S171.pdf; the table
      is for vehicles of 25 km/h or less and others, not for this vehicle's class (not checked in this repository)
  - key: Q54
    name: 航続
    value: 20
    unit: km
    source: default
    trust: 3
    basis: assumption
  - key: Q60
    name: 倒れない角度 (Q30 の組で)
    value: 24
    unit: deg
    source: default
    trust: 1
    basis: >-
      fully loaded (two_cargo, as Q30): 24 deg from ROHVA 1 and ANSI B71.9 as summarized in the CPSC staff
      briefing of 2016-11-22 (PDF p.11), which also gives 33 deg for two people (both read on that page for
      this repository); 35 deg empty: an assumption (no source found)
  - key: Q61
    name: 安全率 (降伏に対して)
    value: 1.5
    unit: "1"
    source: default
    trust: 3
    basis: assumption
  - key: Q65
    name: 衝突の速さ
    value: 40
    unit: km/h
    source: default
    trust: 3
    basis: assumption (the top speed, Q50)
  - key: Q70
    name: 公道を走るか
    value: 私有地 (林道) だけ
    source: default
    trust: 3
    basis: assumption of this fixed file; Q70 is a required question and was not asked
  - key: Q82
    name: 出荷の形
    value: 完成車
    source: default
    trust: 3
    basis: assumption
  - key: Q90
    name: 悪路の走行距離 (疲労)
    value: 5000
    unit: km
    source: default
    trust: 3
    basis: assumption (no public basis found)
  # functional requirements of the off-road vehicle (the intake department's list FN-01..FN-19, 2026-11-03):
  # what the vehicle must do, with its load and range; the tests R7, R8, C3 and H6 judge them
  - key: Q66
    name: 手の操作部に掛かる力 (握る点、前後・上下・回す向きのそれぞれ)
    value: 300
    unit: N
    source: default
    trust: 3
    basis: >-
      assumption: UN Regulation No. 79 (1988 text), table "Steering control effort requirements" (M1, with a
      failure: 300 N) taken as the largest hand force in use (the table was read; using it as a design load is
      the assumption)
  - key: Q67
    name: 手の操作部の握る点の動きの上限 (Q66 の力で)
    value: 5
    unit: mm
    source: default
    trust: 3
    basis: assumption (the range where the feel and position of the control do not change; no source)
  - key: Q68
    name: 足の操作部に掛かる力 (踏む面、踏む向き)
    value: 500
    unit: N
    source: default
    trust: 1
    basis: >-
      UN Regulation No. 13-H, Annex 3, 2.1.1 and 2.3.4 (50 daN, read by the intake department on 2026-11-03)
  - key: Q69
    name: 足の操作部の踏む面の支えの動きの上限 (Q68 の力で)
    value: 5
    unit: mm
    source: default
    trust: 3
    basis: assumption (small against the control's travel; no source)
  - key: Q75
    name: 乗員と部品に掛かる横の加速度
    value: 0.70
    unit: g
    source: default
    trust: 1
    basis: >-
      CPSC NPR 79 FR 68964, § 1422.3(e) (0.70 g; read by the intake department on 2026-11-03). The vehicle's own
      peak from its dynamics tests counts instead when it is larger
  - key: Q76
    name: 乗員と部品に掛かる前後の加速度
    value: 0.90
    unit: g
    source: default
    trust: 1
    basis: >-
      CPSC NPR 79 FR 68964, § 1422.3(b)(1) (peak braking coefficient 0.90; read by the intake department on
      2026-11-03). The vehicle's own peak counts instead when it is larger
  - key: Q77
    name: 乗員の肩・腰の位置 (点 R) を外へ押す力 (10 s)
    value: 725
    unit: N
    source: default
    trust: 1
    basis: CPSC NPR 79 FR 68964, § 1422.5(c)(1)-(5) (read by the intake department on 2026-11-03)
  - key: Q78
    name: Q77 の力を除いたあとの点 R の永久の横の変形の上限
    value: 25
    unit: mm
    source: default
    trust: 1
    basis: CPSC NPR 79 FR 68964, § 1422.5(c) (less than 25 mm; read by the intake department on 2026-11-03)
  - key: Q86
    name: 乗員の空間の荷重の基準の質量 M (横 1.75 M J・後ろ 1.4 M J・上 20 M N)
    value: 500
    unit: kg
    source: default
    trust: 3
    basis: >-
      assumption (the R4 builder's M). The coefficients 1.75, 1.4 and 20 are OECD Standard Code 4 (February 2026),
      3.5.2.1, 3.5.3.1, 3.6.1 (read), borrowed from tractors >= 600 kg; they stay in the R4 builder, the contract
      having no unit J/kg or N/kg for them
  - key: Q87
    name: 泥や石を放す踏面の範囲 (車軸の真上から前へ)
    value: 30
    unit: deg
    source: default
    trust: 3
    basis: >-
      道路運送車両の保安基準の細目を定める告示 (2023.9.22 版) 第178条 第2項 第1号 (read); a public-road rule for
      other traffic, borrowed: applying it to the occupants is an assumption
  - key: Q88
    name: 泥や石を放す踏面の範囲 (車軸の真上から後ろへ)
    value: 50
    unit: deg
    source: default
    trust: 3
    basis: >-
      the same 第178条 第2項 第1号 (read; borrowed, an assumption as Q87). The tread above the axle beyond this
      arc counts too (assumption)
tests: [P1, R1]
design_file: data/designs/offroad-4w-v1.json
round_limit: 1
cost_limit_usd: 2.0
