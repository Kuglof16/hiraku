# (the person's own statement) and basis to "answered in the hearing".
# "not checked in this repository" = the value is taken from the cited page and that page has not
# been read again for this repository. "read 2026-11-03 in a source check" = the value was seen in the
# cited source in a source check on that date.
answers:
