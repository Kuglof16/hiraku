# Serving robot for a restaurant (walking speed, carries trays and drinks, works near guests).
# N09 shows seven domains with two renames: aero becomes "spilling", crash becomes "contact with people".
# Shape: hiraku.contract "requirements_file". trust: 1 primary, 2 secondary, 3 assumption.
# "not checked in this repository" = the value is taken from the cited page and that page has not
# been read again for this repository. "read 2026-11-03 in a source check" = the value was seen in the
# cited source at the place named, in a source check on that date; "secondary" = only a summary gave it.
# Public numbers for this kind of product are few: most values
# are the makers' published specifications or borrowed from standards for industrial robots.
# The required answers (Q40, Q50) are in serving-robot.answers.yaml.

want: 飲食店で料理と飲み物を運ぶ配膳ロボを作りたい。お客さんのすぐそばを歩く速さで動き、飲み物をこぼさないようにしたい
product: serving-robot
speed_class: walk
flags:
  self_propelled: true  # 走
  battery: true         # 池
  electric: true        # 電
  pinch: true           # 挟: wheels and tray columns
  cargo: true           # 荷: trays
  standing: true        # 置
  near_people: true     # 近: guests, staff, children
  liquid: true          # 液: drinks
  vibration: true       # 振: wheel motors, tray and column
  continuous: true      # 続: runs for hours
  assembly: true        # 組
requirements:
  - key: Q03
    name: 使う頻度・年数
    value: 10 h/日 を 5 年
    source: default
    trust: 3
    basis: assumption
  - key: Q11
    name: 路面・床と摩擦係数
    value: 0.5
    unit: "1"
    source: default
    trust: 3
    basis: >-
      assumption: the friction coefficient between the wheel and a dry indoor floor (tile, wood, carpet), 0.5, HIRAKU's own
      value, not read in any source. The floors themselves are the ones of the JARI robot stability test facility's course,
      p.1, https://img.jari.or.jp/v=1740017440/files/user/pdf/stability_tests_of_robots_and_robotic_devices_2020.pdf;
      read 2026-11-03 in a source check (that page lists the surfaces, not a coefficient)
    note: タイル・木・カーペットの床。摩擦係数は資料で確かめていない
  - key: Q13
    name: 縦の坂
    value: 8.33
    unit: "%"
    source: default
    trust: 1
    basis: >-
      バリアフリー法施行令の傾斜路 1/12 (= 8.33 %), 第19条, https://laws.e-gov.go.jp/api/1/lawdata/418CO0000000379;
      read 2026-11-03 in a source check.
      製品の定格は 5 度以下 (Pudu BellaBot), https://www.pudurobotics.com/en/products/bellabot
      (this part not checked in this repository)
  - key: Q15
    name: 段差
    value: 12.7
    unit: mm
    source: default
    trust: 1
    basis: >-
      Bear Robotics Servi Plus の敷居 (1/2 in), Servi Plus page, https://www.bearrobotics.ai/servi-plus;
      read 2026-11-03 in a source check
    note: 床の凹凸は LG CLOi ServeBot の 5 mm、ISO 7176-2 の試験は 15・25 mm も
  - key: Q16
    name: 通る幅
    value: 0.7
    unit: m
    source: default
    trust: 1
    basis: >-
      Keenon の製品ページの最小通路 (T8 0.55 m・T10 0.59 m・T9 0.70 m) の上の端,
      https://www.keenon.com/en/product/T9 (read 2026-11-03 in a source check; it recorded only the T9 page
      address). The earlier value 0.80 m is on none of the pages
    note: 建物の廊下は 1.2 m 以上 (バリアフリー法施行令)
  - key: Q17
    name: 曲がり
    value: その場で旋回
    source: default
    trust: 3
    basis: assumption
  - key: Q19
    name: 気温 (範囲の高い端)
    value: 35
    unit: degC
    source: default
    trust: 3
    basis: assumption (indoor, 5 to 35 degC; the makers publish no operating temperature)
  - key: Q34
    name: 弱い人がいるか
    value: 客の子ども
    source: default
    trust: 3
    basis: assumption
  - key: Q41
    name: 荷の位置
    value: 150
    unit: mm
    source: default
    trust: 3
    basis: >-
      assumption: HIRAKU's own default value, not checked in any source. The height of the cargo's centre of gravity
      above the shelf it stands on, 150 mm (a cup or a plate on a tray); the demo vehicle's cargo is 150 mm above
      its deck as well. The shelf's own height is the design's, not this value
  - key: Q52
    name: 停止距離
    value: 0.5
    unit: m
    source: default
    trust: 3
    basis: >-
      assumption: HIRAKU's own value for a robot that walks beside guests (1.2 m/s): it stops within 0.5 m. Not taken from
      a standard or a maker's page. (The vehicle's 14 m is the 細目告示 table's, for a road vehicle.)
  - key: Q53
    name: 止まっていられる坂
    value: 8.33
    unit: "%"
    source: default
    trust: 3
    basis: >-
      assumption: the robot stays still on the steepest slope it is allowed to drive on, the 1/12 (= 8.33 %) of Q13
      (バリアフリー法施行令 第19条, read 2026-11-03 in a source check); that parking uses the same slope is HIRAKU's choice
  - key: Q54
    name: 稼働時間 (距離に直した値)
    value: 43.2
    unit: km
    source: default
    trust: 3
    basis: >-
      computed: 10 h x Q50 1.2 m/s (4.32 km/h) = 43.2 km, the distance of one charge if the robot never stands still (an upper
      bound; HIRAKU's choice). The 10 h is the lower side of the makers' operating hours 9-18 h, https://www.keenon.com/en/product/T9
      and others; the range 9-18 h read 2026-11-03 in a source check (Keenon). The builders (P4, T1, T2) read a distance in km,
      so the hours are turned into one here
  - key: Q75
    name: 横の加速度
    value: 0.049
    unit: g
    source: default
    trust: 3
    basis: >-
      computed: v^2 / (R g) = (1.2 m/s)^2 / (3 m x 9.80665 m/s^2) = 0.049 g, the sideways acceleration of the tightest turn the
      file allows (Q50 1.2 m/s, Q58 3 m). That the design's inertia loads use it is HIRAKU's choice (assumption); the vehicle's
      value is not borrowed
  - key: Q76
    name: 前後の加速度
    value: 0.147
    unit: g
    source: default
    trust: 3
    basis: >-
      computed: v^2 / (2 s g) = (1.2 m/s)^2 / (2 x 0.5 m x 9.80665 m/s^2) = 0.147 g, the braking of a stop within Q52 0.5 m from
      Q50 1.2 m/s (it is larger than the start, Q51 3 s: 0.04 g). That the design's inertia loads use it is HIRAKU's choice
      (assumption); the vehicle's value is not borrowed
  - key: Q12
    name: 路面の粗さ (ISO 8608 のクラス)
    value: A
    source: default
    trust: 3
    basis: >-
      assumption: an indoor floor (tile, wood, carpet) is taken as ISO 8608 class A, the smoothest class; not read in any source
      for floors (ISO 8608 is for roads). It is only the input the fatigue builder needs
  - key: Q90
    name: 走行距離 (疲労)
    value: 78840
    unit: km
    source: default
    trust: 3
    basis: >-
      computed: Q03 10 h a day for 5 years, at Q50 1.2 m/s (4.32 km/h) with the robot never standing still: 43.2 km x 365 x 5 =
      78 840 km (an upper bound; HIRAKU's choice). The hours and the years are Q03's assumption
  - key: Q55
    name: 充電時間
    value: 4.5
    unit: h
    source: default
    trust: 1
    basis: Pudu BellaBot, https://www.pudurobotics.com/en/products/bellabot; read 2026-11-03 in a source check
  - key: Q60
    name: 静的に倒れない限界
    value: 10
    unit: deg
    source: default
    trust: 3
    basis: assumption (満載で 10 度。製品の登坂の定格は 5 度以下、JARI の走行路は 10 度)
  - key: Q61
    name: 安全率 (降伏に対して)
    value: 1.5
    unit: "1"
    source: default
    trust: 3
    basis: assumption
  - key: Q62
    name: 人に当たったときの力
    value: "ISO/TS 15066 の部位ごとの値 (準静的、下腿 130・大腿 220・胸 140・頭 130 N) を借用"
    source: default
    trust: 2
    basis: >-
      ISO/TS 15066 の体のモデルの表を載せた論文, Table 1, https://arxiv.org/pdf/2311.13814;
      read 2026-11-03 in a source check. 産業用ロボットの値を借りる (配膳ロボの規格の値ではない)
  - key: Q63
    name: 挟み込みの隙間
    value: ISO 13854 (指 25 mm)
    source: default
    trust: 1
    basis: >-
      ISO 13854:1996 の試し読み, Table 1, https://cdn.standards.iteh.ai/samples/22598/44d1054ccf4f41e1adefb8020dbaaa13/ISO-13854-1996.pdf;
      read 2026-11-03 in a source check
  - key: Q72
    name: なぞる規格
    value: ISO 13482 = JIS B 8445、JIS B 8446-1
    source: default
    trust: 1
    basis: >-
      ISO 13482 の要旨 https://www.iso.org/standard/53820.html. Secondary: seen only in search summaries
      on 2026-11-03 (iso.org returned 403); the standard itself not checked in this repository
  - key: Q73
    name: 電池の規則
    value: 輸送は UN 38.3
    source: default
    trust: 1
    basis: >-
      UN 試験・基準マニュアル Rev.5 (2009) の第三者の写し (読めたのは旧版),
      https://certifico.com/component/attachments/download/748; read 2026-11-03 in a source check
  - key: Q80
    name: 材料と接合
    value: 樹脂 + アルミ
    source: default
    trust: 3
    basis: assumption
  - key: Q82
    name: 出荷の形
    value: 完成品
    source: default
    trust: 3
    basis: assumption
  - key: Q91
    name: 運転時間
    value: 10 h/日 を 5 年
    source: default
    trust: 3
    basis: assumption
