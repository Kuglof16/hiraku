# Fixed requirements for the MVP run (the demo vehicle).
# Shape: hiraku.contract "requirements_file". Sources are written in `basis`.
# "not checked in this repository" = the value is taken from the cited page,
# and that page has not been read again for this repository.
# "assumption" = an engineering assumption with no public source (trust 3).
# trust and "not checked" are different things: trust is the kind of source
# (1 primary, 2 secondary, 3 assumption); "not checked" says whether the value
# has been read again against that source.

want: 林道を走れる 2 人乗りの小さなオフロード車両 (4 輪、最高 40 km/h、500 kg まで、積載 150 kg)
product: offroad-4w
speed_class: vehicle
flags:
  ride: true            # 乗: people ride on it
  lean: true            # 預: people sit on the seat
  self_propelled: true  # 走
  outdoor: true         # 外
  rough: true           # 悪: unpaved forest roads
  public_road: false    # 公: Q70 is a required question; this file assumes private land only (not asked)
  battery: true         # 池
  electric: true        # 電
  pinch: true           # 挟: suspension gaps
  cargo: true           # 荷
  standing: true        # 置
  vibration: true       # 振: wheels and motor rotate
  continuous: true      # 続
  assembly: true        # 組
requirements:
  - key: Q12
    name: 路面の粗さ (ISO 8608 のクラス)
    value: C
    source: default
    trust: 3
    basis: assumption (林道を ISO 8608 の class C とみる。ISO 8608 の本文は、このリポジトリでは確かめていない)
  - key: Q13
    name: 縦の坂
    value: 12
    unit: "%"
    source: default
    trust: 3
    basis: assumption
  - key: Q15
    name: 段差
    value: 100
    unit: mm
    source: default
    trust: 3
    basis: assumption
  - key: Q19
    name: 気温 (範囲の高い端)
    value: 40
    unit: degC
    source: default
    trust: 3
    basis: assumption
  - key: Q30
    name: 人数と荷重の組 (見る組)
    value: two_cargo
    source: user
    trust: 1
    basis: request (2 人乗り、積載 150 kg)
    note: MVP は two_cargo (2 人 + 荷) だけを見る。empty・driver・two はまだ見ない。乗員と荷は設計の部品 (kind occupant / cargo)
  - key: Q33
    name: 体重 (強さの不利側)
    value: 76.6
    unit: kg
    source: default
    trust: 1
    basis: AIST 人体寸法データベース 1991-92, 若年男性 95 パーセンタイル, https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (not checked in this repository)
  - key: Q40
    name: 積載
    value: 150
    unit: kg
    source: user
    trust: 1
    basis: request
    note: 乗員とは別の荷として扱う (聞いていない)
  - key: Q50
    name: 最高速度
    value: 40
    unit: km/h
    source: user
    trust: 1
    basis: request
  - key: Q54
    name: 航続
    value: 20
    unit: km
    source: default
    trust: 3
    basis: assumption
  - key: Q61
    name: 安全率 (降伏に対して)
    value: 1.5
    unit: "1"
    source: default
    trust: 3
    basis: assumption
  - key: Q70
    name: 公道を走るか
    value: 私有地 (林道) だけ
    source: default
    trust: 3
    basis: assumption of this fixed file; Q70 is a required question and was not asked
  - key: Q90
    name: 悪路の走行距離 (疲労)
    value: 5000
    unit: km
    source: default
    trust: 3
    basis: assumption
# The tests whose scripted steps reach a verdict. Without this list the catalog
# picks every test that applies to the flags and has a load-case builder (the
# run names the others and why); C1, P4, R3, T1, T2 and H5 build, but their
# scripted steps do not judge yet.
tests: [P1, R1, N1, H1, H3]
design_file: data/designs/offroad-4w-v1.json
round_limit: 1
cost_limit_usd: 2.0
