# The runs the screen offers as demos (its demo list) and the video cuts each one is for.
# file: a requirements file under data/requirements/ (its round_limit and cost_limit_usd apply).
# request: an A1 request instead of a run: the want of data/requirements/products/<product>.yaml is sent
#   and Claude picks the domains (those products have no design kind yet: hiraku.designgen.archetypes is
#   empty for their flags, so a run would stop before version 1).
# mix (optional): the model mix a real run uses, a name in data/catalog/model_mixes.yaml (the screen passes it as
#   `python -m hiraku run ... --mix NAME`; without it, the mix is `default`).
# estimates_usd: the rough cost of a real Claude run per mix, next to the file's cost_limit_usd. An estimate.
#   Shape for the screen: {<mix name>: {usd: <number>, upper_usd: <number>}} for every mix in model_mixes.yaml,
#   or null when there is none. hiraku.catalog.cost.estimate_mix: the record-writing calls of the scripted
#   run, per agent, times the cost per call of the one real run measured, times the price of that agent's model
#   relative to Opus 5.5, as a range: usd with the lowest ratio over the kinds of token, upper_usd with the
#   highest (the measured run's token mix is not known; for Haiku 0.025 and 0.25, its cache read above 100K;
#   equal when no role is on Haiku). The lead's own tokens are not separated, so lead-sonnet comes out as cae-sonnet.
# modes: how it is meant to be run. Every file here ran end to end in its scripted run before it was
# listed, or stops where its line says (tests/tools/test_catalog.py checks the files load). Kept in
# data/catalog/, not beside the requirements files, so nothing that runs every data/requirements/*.yaml
# takes it for one.
runs:
  - id: n09-electric-guitar
    title: ギターの分野を選ぶ
    shows: 依頼の文から Claude が製品の性質を読み、使う分野とその理由・呼び名を選ぶ (A1)
    request: {product: electric-guitar}
    modes: [claude]
    cuts: [N09]
  - id: n09-care-bed
    title: 介護ベッドの分野を選ぶ
    shows: 依頼の文から Claude が製品の性質を読み、使う分野とその理由・呼び名を選ぶ (A1)
    request: {product: care-bed}
    modes: [claude]
    cuts: [N09]
  - id: n09-serving-robot
    title: 配膳ロボの分野を選ぶ
    shows: 依頼の文から Claude が製品の性質を読み、使う分野とその理由・呼び名を選ぶ (A1)
    request: {product: serving-robot}
    modes: [claude]
    cuts: [N09]
  - id: n11-n12
    title: 重心の高さの単位の取り違え
    shows: >-
      要件の荷の重心の高さを 62 cm のつもりで 62 mm と書いた。hooks が予測の無い解析を止め、照合で
      手計算と解析が食い違い、原因 (単位の取り違え) を書いて、荷を設計どおりにして予測し直すと合う
    file: offroad-4w-n12.yaml
    # scripted only: in the first Claude run of this file (driver claude_code_plugin, 2026-11-03) the lead
    # predicted first and took the loaded centre of gravity from design_summary (the design's cargo at its
    # real height), not the requirement's 62 mm, so it matched with no HK1 denial and no unit mistake. The
    # mistake here is the script's choice of input, which a Claude run need not repeat.
    modes: [scripted]
    # python -m hiraku.catalog.cost <run folder>: 7 calls (cae.handling 7) in scripted run 20261103-153411-offroad-4w-scripted
    estimates_usd:
      default: {usd: 1.07, upper_usd: 1.07}
      cae-sonnet: {usd: 0.54, upper_usd: 0.54}
      cae-haiku: {usd: 0.03, upper_usd: 0.27}
      lead-sonnet: {usd: 0.54, upper_usd: 0.54}
    cuts: [N11, N12]
  - id: n13
    title: ロールバーのツールをその場で作る
    shows: >-
      横転しても乗っている人を守りたい。棚に無いロールバーの横転のツールを、Claude が実行の中で書き、
      答えの分かっている例で確かめてから使う (台本の運転では、R4 は判定の無いまま止まる)
    file: offroad-4w-n13.claude.yaml
    modes: [claude]
    estimates_usd: null  # its scripted run (20261103-153628) wrote no record before stopping at R4; Claude writing the tool is not in any record yet
    cuts: [N13]
  - id: n14
    title: ナレッジを渡して規則にする
    shows: >-
      実行の途中で規則のファイルを A5 に落とすと規則になり、部品に当たり、HIRAKU が聞き返す。Claude で
      回すときは、実行が始まってから data/knowledge/samples/bending-notes.md を A5 に落とす
    file: offroad-4w-n14.yaml
    modes: [scripted, claude]
    # python -m hiraku.catalog.cost <run folder>: 23 calls (cae.strength 23) in scripted run 20261103-153544-offroad-4w-scripted
    estimates_usd:
      default: {usd: 3.52, upper_usd: 3.52}
      cae-sonnet: {usd: 1.76, upper_usd: 1.76}
      cae-haiku: {usd: 0.09, upper_usd: 0.88}
      lead-sonnet: {usd: 1.76, upper_usd: 1.76}
    cuts: [N14]
  - id: video
    title: 動画の運転 (限界の外を含む)
    shows: >-
      デモの車の全部の試験と限界の外の 7 つ。赤を設計役が 4 回直し (配置、乗り降りの網、モーター、
      レールのつなぎ目)、v5 で直せる赤は緑になる。限界の外は、4 つ (電池の温度・330 mm の段差・
      滑る路面の停止・横の坂) が赤のまま、250 mm の段差の強度と横風は v5 で緑、250 mm の段差の
      前輪の力は判定なしで止まる
    file: offroad-4w-video.yaml
    modes: [scripted, claude]
    # scripted run 20261106-084552-offroad-4w-scripted on main 1a155201: stopped on version 5 (stop_code not_judged:
    # P1-step250-beyond ends its case without a verdict); red on v5: T1-52C, P1-step330, S4-mu0.3, S5-slope44 (beyond)
    # python -m hiraku.catalog.cost <run folder>: 742 calls (cae.aero 16, cae.crash 27, cae.handling 81, cae.nvh 27,
    # cae.powertrain 134, cae.strength 150, cae.thermal 72, packager 235)
    estimates_usd:
      default: {usd: 113.44, upper_usd: 113.44}
      cae-sonnet: {usd: 56.72, upper_usd: 56.72}
      cae-haiku: {usd: 2.84, upper_usd: 28.36}
      lead-sonnet: {usd: 56.72, upper_usd: 56.72}
    cuts: [N04, N06, N17]
  - id: demo
    title: デモの車の 11 の試験
    shows: >-
      段差・フレームとつなぎ目・振動・組み立て・乗り降り・加速。赤を設計役が 4 回直し (配置、乗り降りの網、
      モーター、レールのつなぎ目)、v5 で全部緑
    file: offroad-4w.yaml
    modes: [scripted, claude]
    # scripted run 20261106-081501-offroad-4w-scripted on main 1a155201: done on version 5, every tile green; 11 tests
    # listed, 10 judged (P1 has no criterion: compared, not judged)
    # python -m hiraku.catalog.cost <run folder>: 415 calls (cae.nvh 27, cae.powertrain 55, cae.strength 113, packager 220)
    estimates_usd:
      default: {usd: 63.45, upper_usd: 63.45}
      cae-sonnet: {usd: 31.72, upper_usd: 31.72}
      cae-haiku: {usd: 1.59, upper_usd: 15.86}
      lead-sonnet: {usd: 31.72, upper_usd: 31.72}
