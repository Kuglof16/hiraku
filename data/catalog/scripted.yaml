# Scripted runs (python -m hiraku run ... --scripted): no Claude. The same tool
# functions and hook rules run in a fixed order, so tests, the screen and QA
# get a real events.jsonl without an API key. The run id ends in -scripted.
#
# Formula ids and input names are those of the K0 registry (hiraku.solvers).
# Inputs never name a member or section of one design; they are read off the
# design through hiraku.tools.summary.design_summary.
#
# Input refs:
#   lc.<param>                     param of this load case
#   req.<Q key>                    requirement value and unit
#   load.<name>                    mass, weight, cg_x/y/z, cg_from_front_axle of the frame and the parts on
#                                  board under this load case's loading
#   load.rail_joint.<input>        inputs of frame_static.rail_joint_stress but F and W under this loading;
#                                  load.rail_joint.support is the wheel whose load is W
#   summary.<name>                 wheelbase, front_axle_x, front_wheels, front_wheel_radius, track_front, ...
#   summary.rail_section.<dim>     dims of the section most used by members along x
#   summary.member_length.<id>     length of a member
#   design.support.<id>.<field>    e.g. design.support.FL.radius_mm (unit from the suffix)
#   design.section.<key>.<dim>     section dimension in mm (dims_mm)
#   design.var.<name>              design variable
#   pred.<quantity>                newest prediction of that quantity in this run and version
#   ana.<load case>.<quantity>     result of the trusted (matched) analysis of an upstream load case
#                                  (the load case may be named by its test id: ana.P1.front_wheel_force,
#                                  the case of that test that feeds this one, past the limit or not)
#   from.<name>                    what the prediction's inputs_from(design, load case) reads off the design
#                                  (a builder's step in Python can carry that function)
#   {ref} inside a ref             replaced by the name it points at, e.g. wheel_load_{load.rail_joint.support}
#
# Load cases this file has no step for take the step of their test's builder
# (hiraku.catalog.builders.PLANS), in the same shape.
#
# After analyze, every prediction whose quantity is among the analysis results
# is compared. A mismatch stops the run unless the step names it in
# expected_mismatch: then its cause and fix (written in the plan; `source`
# says which results were compared to find it) are recorded with
# record_cause, compare in that domain is denied by HK3 until then, and the
# step predicts again with `retry`, which is itself a step and may expect a
# mismatch of its own. With safe_side true (and safe_side_reason, also written
# in the plan) the cause is recorded as seen from the safe side: record_cause
# checks that the prediction is the unfavourable value and makes the verdict
# from it, and the step ends. With `end` true the cause is recorded and the step ends there
# (`end_say`); when the load case's criterion judges that quantity, the test stays without a
# verdict and the run goes on. With none of these the run says `stop` and stops.

offroad-4w:
  show_hk1: true   # call analyze once without a prediction, so the HK1 denial is recorded
  # The designer's revisions, one per round, used when a tile comes out red
  # (revise_design: the variables of hiraku.designgen, absolute values).
  revise:
    - say: 組み立てと動力の赤を直すため、トレッドを広げ、ステアリングを前へ出し、モーターを強くします
      changes:
        track: {value: 1220, unit: mm}
        steering_x: {value: -200, unit: mm}
        motor_peak_power: {value: 12, unit: kW}
      reason: >-
        H1: 前輪を切るとレールに当たるので、トレッドを広げて輪をレールから離す。
        H3: 運転者の膝とステアリングのすき間が足りないので、ステアリングと足元の箱を 50 mm 前へ出す。
        P3: 最高速度までの時間が長すぎるので、モーターの最大出力を上げる
      source: the assembly tool's H1 and H3 and the launch tool's P3 on the demo vehicle, before and after this change
  steps:
    - &p1_step
      load_case: P1-step100
      tool: step_climb
      say: 段差の前で止まっているときの前輪の荷重を、てこの比で先に見積もります
      predictions:
        - quantity: front_wheel_load
          formula_id: mass_props.front_wheel_load
          output: W
          assumptions: [前輪の荷重は止まっているときと同じとみる]
          inputs: {m: load.mass, a: load.cg_from_front_axle, L: summary.wheelbase, n: summary.front_wheels}
        - quantity: front_wheel_force
          formula_id: step_climb.wheel_force_rigid
          output: F
          assumptions: [押す力は前輪の車軸にかかる]
          inputs: {r: summary.front_wheel_radius, h: lc.step_height, W: pred.front_wheel_load}
      expected_mismatch:
        quantity: front_wheel_load
        source: step_climb against the lever rule (mass_props.front_wheel_load) on the demo vehicle
        cause: >-
          てこの比の式は止まっているときの前輪の荷重を出す。段を登るときは、後輪が地面の高さで押し、
          段の角が前輪の車軸の高さで押し返すので、その偶力で荷重が後輪へ移り、前輪の荷重は小さくなる
        fix: 偶力を入れた式 step_climb.pushed_wheel_load で、前輪の荷重と押す力を予測し直す
        retry:
          say: 偶力を入れた式で、前輪の荷重と押す力を予測し直します
          predictions: &p1_pushed
            - quantity: front_wheel_load
              formula_id: step_climb.pushed_wheel_load
              output: W
              assumptions: [後輪が地面の高さで押し、段が前輪の車軸の高さで押し返す]
              inputs: {m: load.mass, a: load.cg_from_front_axle, L: summary.wheelbase, n: summary.front_wheels,
                       r: summary.front_wheel_radius, h: lc.step_height}
            - quantity: front_wheel_force
              formula_id: step_climb.pushed_wheel_load
              output: F
              assumptions: [後輪が地面の高さで押し、段が前輪の車軸の高さで押し返す]
              inputs: {m: load.mass, a: load.cg_from_front_axle, L: summary.wheelbase, n: summary.front_wheels,
                       r: summary.front_wheel_radius, h: lc.step_height}
    - load_case: R1-step100
      tool: frame_static
      say: &r1_say 段差を押して登るときのレールを、前後の車軸で支えた梁とみて曲げの応力を見積もります
      predictions: &r1_beam
        - quantity: max_stress
          formula_id: frame_static.rail_step_bending
          output: sigma
          assumptions: [車体の重さは全部レールにかかるとみる (安全側)]
          inputs:
            W: load.weight
            L: summary.wheelbase
            F: ana.P1.front_wheel_force
            z: summary.rail_section.z
            r: summary.front_wheel_radius
            b: summary.rail_section.b
            h: summary.rail_section.h
            t: summary.rail_section.t
      expected_mismatch:
        quantity: max_stress
        source: &r1_source1 frame_static against frame_static.rail_step_bending on the demo vehicle
        cause: &r1_cause1 >-
          梁の式は前後の車軸のあいだだけを見ている。後ろの車軸より後ろに張り出した荷とモーターの重さが、
          後ろの車軸のところでレールを曲げる (張り出しの曲げ) が、両端で支えた梁の式では支点の曲げは 0 になる。
          また、車輪はレールの外側にあるので、車輪の力はレールに横の曲げとねじりも加えるが、梁の式には入っていない
        fix: &r1_fix1 >-
          張り出しの曲げと、外側から入る車輪の力による横の曲げとねじりを入れた式 frame_static.rail_joint_stress で、
          後ろの車軸の継ぎ手のレールの応力を予測し直す
        retry:
          say: &r1_retry_say 後ろの車軸の継ぎ手で、張り出しと押す力による縦の曲げに、車輪のずれから来る横の曲げとねじりを足して予測し直します
          predictions: &r1_joint
            - quantity: max_stress
              formula_id: frame_static.rail_joint_stress
              output: sigma
              assumptions:
                - 左右は同じように押される
                - 継ぎ手の前のレールの先の端は動かないとみる
              inputs:   # load.rail_joint: read off the design for this loading (hiraku.tools.summary)
                M_oh: load.rail_joint.M_oh
                F: ana.P1.front_wheel_force
                W: ana.P1.wheel_load_{load.rail_joint.support}
                z: load.rail_joint.z
                e: load.rail_joint.e
                L1: load.rail_joint.L1
                L_c: load.rail_joint.L_c
                E: load.rail_joint.E
                nu: load.rail_joint.nu
                b: load.rail_joint.b
                h: load.rail_joint.h
                t: load.rail_joint.t
                b_c: load.rail_joint.b_c
                h_c: load.rail_joint.h_c
                t_c: load.rail_joint.t_c
          expected_mismatch:
            quantity: max_stress
            source: >-
              frame_static against frame_static.rail_joint_stress on the demo vehicle, the vertical bending
              and the sideways bending and twist each
            cause: >-
              今度は手計算が大きい。鉛直の曲げは 1 % で合い、横の曲げとねじりが倍に出る。
              式が隣の継ぎ手 S2 を固定とみなしているのに、フレームではそこも回るため
            fix: &r1_fix2 >-
              合否は安全側の手計算の値で出す。もっと近い値が要るときは、隣の継ぎ手も回るとみた式で予測し直す
            safe_side: true
            safe_side_reason: >-
              鉛直の曲げは解析と 1 % で合っていて、外れているのは隣の継ぎ手を固定とみた分 (横の曲げとねじり) だけ。
              継ぎ手を固定とみるとレールは実際より硬く、横の曲げとねじりを多く受け持つので、手計算の応力は
              大きく出る側にしかずれない。だから手計算の値は本当の応力を上から押さえている
    # R1s (files that list it): the same step on the frame as shells (frame_shell), judged on the
    # hot-spot stress where a cross member's end bends the rail's side wall. Before the driven P1,
    # for the same reason as R1. Inputs from the analysis builders' joint_wall_calc.
    - load_case: R1s-step100
      tool: frame_shell
      say: 段差を押して登るときの輪の力で、横の部材の端がレールの側の壁を板として曲げる応力 (つなぎ目の壁) を先に見積もります
      predictions:
        - quantity: max_hot_spot_stress
          formula_id: frame_static.joint_wall_bending
          output: sigma
          assumptions: [レールのねじりを横の部材が受け、その端のモーメントがレールの側の壁を曲げる, 側の壁は上と下の壁で支えた板とみる]
          inputs: {M: from.M, b: from.b, h: from.h, t: from.t, b_c: from.b_c, h_c: from.h_c, t_c: from.t_c, E: from.E,
                   nu: from.nu, leg: from.leg, through: from.through, open_end: from.open_end}
          inputs_from: analysis.joint_wall_calc
    # The same step driven in K2 (step_climb_dynamic), after R1: R1 reads the step_climb results
    # (the wheel loads), and an upstream load case gives the newest matched analysis.
    - &p1_dynamic
      load_case: P1-step100
      tool: step_climb_dynamic
      say: 段差を K2 で走らせて、前輪が段の角から浮く瞬間の押す力と前輪の荷重を、偶力を入れた式と比べます
      predictions: *p1_pushed
    # Past the limit (requirements `beyond`): the same steps at the 250 mm step. On the demo vehicle the
    # lever rule is off by -51 % there and the couple formula matches, as at 100 mm; the beam formula is
    # +34 % off (the same cause) and rail_joint_stress -20 %, whose parts are written in the cause below.
    - <<: *p1_step
      load_case: P1-step250-beyond
    - load_case: R1-step250-beyond
      tool: frame_static
      say: *r1_say
      predictions: *r1_beam
      expected_mismatch:
        quantity: max_stress
        source: *r1_source1
        cause: *r1_cause1
        fix: *r1_fix1
        retry:
          say: *r1_retry_say
          predictions: *r1_joint
          expected_mismatch:
            quantity: max_stress
            source: >-
              frame_static against frame_static.rail_joint_stress on the demo vehicle at the 250 mm step, before
              and after the designer's revision, the vertical bending, the sideways bending, the twist and the
              axial force each (before: 0.5 %, 2.3 x, 2.0 x; after: 0.3 %, 2.3 x, 1.9 x)
            cause: >-
              今度も手計算が大きい (約 20〜24 %)。鉛直の曲げは 1 % 以内で合い、横の曲げは約 2.3 倍、ねじりは約 2 倍に出る。
              式が隣の継ぎ手 S2 を固定とみなしているのに、フレームではそこも回るため
            fix: *r1_fix2
            safe_side: true
            safe_side_reason: >-
              鉛直の曲げは解析と 1 % 以内で合っていて、外れているのは隣の継ぎ手を固定とみた分 (横の曲げとねじり) だけ。
              継ぎ手を固定とみるとレールは実際より硬く、横の曲げとねじりを多く受け持つので、手計算の応力は
              大きく出る側にしかずれない。だから手計算の値は本当の応力を上から押さえている
    - <<: *p1_dynamic
      load_case: P1-step250-beyond
      expected_mismatch:
        quantity: front_wheel_load
        source: >-
          step_climb_dynamic against step_climb.pushed_wheel_load on the demo vehicle at the 250 mm step:
          the push stops with the rear wheels spinning (required_mu_push at the road's 0.8); the same run with
          friction 2.0 lifts the front wheels and matches the formula (W -4.5 %, F +5.8 %, required friction +3.2 %)
        cause: >-
          段差 250 mm を前輪が乗り越えるには、後輪が前輪の荷重の約 6 倍の力で押す必要があり、後輪の摩擦が約 μ 1.5 要る
          (版 1 で後輪の荷重 4655 N、押す力 6775 N)。路面は μ 0.8 なので、静かな押し上げでは前輪が浮く前に後輪が空回りし、
          K2 の値は前輪が浮いた瞬間ではなく、空回りした瞬間のもの。手計算の式は、後輪が押し切れることを前提にしている
        fix: >-
          後輪の駆動では、静かな押し上げではこの段差を越えられない。勢いをつける (10 km/h では越えたが、大きな衝撃が出る)、
          前輪も駆動する、車輪を大きくする、のどれかで越える
        end: true
        end_say: >-
          後輪が空回りして、静かな押し上げではこの段差を越えられませんでした。原因を記録して、この手順はここで終えます
          (R1 には静的な釣り合いの結果を使っています)
    # Past the limit: a step higher than the front wheel radius (hiraku/catalog/build.py
    # WALL_STEP_RATIO). Only the moving tool: the static push of step_climb needs h < r.
    # The hand calculation is the rigid wheel's limit (climbable 0 from h = r up); K2's climbable
    # is 1 when the push or the run at speed gets the wheel onto the step.
    - load_case: P1-step330-beyond
      tool: step_climb_dynamic
      say: 段差が車輪の半径より高いので、角の押す力が水平になり、硬い輪では越えられないとみて先に見積もります
      predictions:
        - quantity: climbable
          formula_id: step_climb.climb_limit
          output: climbable
          assumptions: [車輪はたわまない硬い輪とみる]
          inputs: {r: summary.front_wheel_radius, h: lc.step_height}

# The video run, data/requirements/offroad-4w-video.yaml: the offroad-4w plan, and its revision also
# reinforces the joints for R1s (the hot spot of version 1 is past the limit). Source of the values: the
# analysis department's runs of frame_shell and joint_wall_bending on the demo vehicle with this whole
# revision (the wider track lengthens the cross members): rail_t 4.5 mm alone 186.4 MPa, with gussets of
# 80 mm and 3.2 mm 154.0 MPa against 163.3 (the hand calculation 140.6, -9 %).
offroad-4w-video:
  extends: offroad-4w
  revise:
    - say: 組み立て・動力・強度 (つなぎ目) の赤を直すため、トレッドを広げ、ステアリングを前へ出し、モーターを強くし、レールの肉厚を上げてつなぎ目にガセットを足します
      changes:
        track: {value: 1220, unit: mm}
        steering_x: {value: -200, unit: mm}
        motor_peak_power: {value: 12, unit: kW}
        rail_t: {value: 4.5, unit: mm}
        gusset_leg: {value: 80, unit: mm}
        gusset_thickness: {value: 3.2, unit: mm}
      reason: >-
        H1: 前輪を切るとレールに当たるので、トレッドを広げて輪をレールから離す。
        H3: 運転者の膝とステアリングのすき間が足りないので、ステアリングと足元の箱を 50 mm 前へ出す。
        P3: 最高速度までの時間が長すぎるので、モーターの最大出力を上げる。
        R1s: 横の部材の端がレールの側の壁を曲げ、つなぎ目のホットスポットが限界を超えるので、レールの肉厚を 2.3 mm から 4.5 mm にし、
        つなぎ目に脚 80 mm・厚さ 3.2 mm のガセットを足す (トレッドを広げると横の部材が長くなり、肉厚だけでは足りない)
      source: >-
        the assembly tool's H1 and H3 and the launch tool's P3 on the demo vehicle, before and after this change;
        frame_shell and joint_wall_bending with this revision, rail_t 4.5 mm with and without gussets (the analysis department)

# Video scene N15, data/requirements/offroad-4w-n15.yaml: the offroad-4w plan on the demo vehicle
# (roll bar, floors, parts with their systems) with the video file's tests, R1s included, revised
# round by round until every tile is green (tests/agent/test_scene_n15.py). Each revision fixes the
# reds of the version before it; the values were read off the scripted runs' records (`source`).
offroad-4w-n15:
  extends: offroad-4w
  revise:
    - say: 組み立て・動力・強度 (つなぎ目) の赤を直すため、トレッドを広げ、ステアリングを前へ出し、モーターを強くし、レールの肉厚を上げてつなぎ目にガセットを足します
      changes:
        track: {value: 1220, unit: mm}
        steering_x: {value: -200, unit: mm}
        motor_peak_power: {value: 13, unit: kW}
        rail_t: {value: 4.5, unit: mm}
        gusset_leg: {value: 80, unit: mm}
        gusset_thickness: {value: 3.2, unit: mm}
      reason: >-
        H1: 前輪を切るとレールに当たり、切れる角が 16.5° で 30° に足りないので、トレッドを 1100 mm から 1220 mm に広げて輪をレールから離す。
        H3: 運転者の膝の前の余裕が -69 mm (ステアリングの柱に当たる) なので、ステアリングを 50 mm 前へ出す。
        P3: 40 km/h までが 6.48 s で 6 s を超えるので、モーターの最大出力を 10 kW から 13 kW に上げる (12 kW では 5.97 s で余裕が 0.5 % しかない)。
        R1s: 横の部材の端がレールの側の壁を板として曲げ、つなぎ目のホットスポットが 472 MPa で限界 163 MPa を超えるので、
        レールの肉厚を 2.3 mm から 4.5 mm にし、つなぎ目に脚 80 mm・厚さ 3.2 mm のガセットを足す
        (トレッドを広げると横の部材が長くなり、肉厚 4.5 mm だけでは手計算で 164 MPa。横の部材を 60 mm に高くすると、
        ホットスポットが横の部材の 2.3 mm の壁へ移り、つなぎ目の壁の式では見積もれない)
      source: >-
        the N15 scripted run 20261103-163520-offroad-4w-scripted, version 1: H1 ver-0015 (free_steer_angle 16.48 deg),
        H3 ver-0016 (knee_room -69.25 mm at steering_column), P3 ver-0009 (time_to_speed 6.477 s), R1s ver-0002
        (frame_shell ana-0005 472.0 MPa at rail_L_BE; joint_wall_bending pred-0007 461.8 MPa). The values: the same
        tools on the design with this revision and its variants. assembly: steering_x -200 knee_room 226.6 mm,
        free_steer_angle 30 deg; launch: 12 kW 5.967 s, 13 kW 5.724 s; joint_wall_bending (joint_wall_calc): rail_t 4.5
        alone 163.8 MPa, with these gussets 142.0; frame_shell after step_climb: with these gussets 151.1 MPa at
        rail_L_BE (the rail's wall), with cross_h 60 instead 141.0 MPa at cross_B (the cross member's own wall, where
        the hand calculation gives 75.5) - the run 20261103-171304-offroad-4w-scripted stopped there on cmp-0043

# Video scenes N11 and N12, data/requirements/offroad-4w-n12.yaml: S1 on the design with a tall
# load, whose requirement Q41 (the load's CG height above the deck) carries a unit mistake
# (62 mm written for 62 cm). The hand calculation places the load at Q41 (k2_tests.tilt_inputs),
# the tilt tool solves it where the design has it; the cause is recorded and the step predicts
# again with the load as built (k2_tests.tilt_inputs_as_built).
offroad-4w-n12:
  extends: offroad-4w
  steps:
    - load_case: S1-tilt-two_cargo
      tool: tilt
      say: 傾斜台で倒れる角度を、ばねで車体がロールする分を入れた式で先に見積もります。荷の高さは要件 Q41 から取ります
      predictions:
        - &s1_tilt
          quantity: tilt_angle
          formula_id: tilt.spring_roll_angle
          output: theta
          assumptions: [車体はばねの上でロールし、ロールの軸は地面にある, タイヤはたわまない, 荷の重心は荷台の上 Q41 の高さ]
          inputs: {t: summary.track_front, h: from.h, e: from.e, m: load.mass, m_s: from.m_s, h_s: from.h_s, k: from.k, n: from.n}
          inputs_from: k2_tests.tilt_inputs
      expected_mismatch:
        quantity: tilt_angle
        source: >-
          tilt against tilt.spring_roll_angle on data/designs/offroad-4w-tallcargo.json, the hand calculation with
          the load at Q41 (62 mm above the deck) and the tool with the load as built (its CG 620 mm above the deck)
        cause: >-
          要件 Q41 (荷の重心の高さ) の単位の取り違え。62 cm のつもりが 62 mm と書かれていて、手計算は荷を荷台の上 62 mm に置いた。
          設計の荷は高さ 1240 mm で、重心は荷台の上 620 mm にある。手計算は車全体の重心を低く見て、倒れる角度を大きく出した
        fix: >-
          荷の高さを設計のとおり (重心は荷台の上 620 mm) にして予測し直す。要件の Q41 は 620 mm (62 cm) に直すよう、人に伝える
        retry:
          say: 荷の高さを設計のとおりにして、倒れる角度を予測し直します
          predictions:
            - <<: *s1_tilt
              assumptions: [車体はばねの上でロールし、ロールの軸は地面にある, タイヤはたわまない, 荷は設計のとおりの高さ]
              inputs_from: k2_tests.tilt_inputs_as_built

# Video scene N14 (A5, knowledge to rules), data/requirements/offroad-4w-n14.yaml: the
# offroad-4w plan, and after P1 the person drops a file of rules on A5. The run does what the
# screen's server does (knowledge/<name>, inbox/<n>-knowledge.json); the inbox turns the file
# into rules. The two sentences that need a formula are answered here in Claude's place (skip
# with a reason; the reasons are facts about the design's values, which have no orientation or
# part-to-part distance). Then the rules are checked on the parts, and the lead asks about the
# hit. Source of the expected hit: hiraku/intake's SampleNotesTest on the demo design
# (battery 50 kg against the sample's "電池の質量は 30 kg 以下").
offroad-4w-n14:
  extends: offroad-4w
  knowledge_drop:
    after: P1-step100
    file: data/knowledge/samples/bending-notes.md
    text: 板金と電池のメモです。規則にしてください
    answer:
      say: 式にできない 2 文は、理由を書いて規則にしません
      skip:
        c3: 向きは式にできない
        c5: 部品どうしの距離を測る値が設計に無い
  rule_check: true
  ask_on_hits: true
