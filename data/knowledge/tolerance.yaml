# Built-in rules: tolerance (公差). See sheet-metal.yaml for the shape.
doc_id: KN-TL
title: 公差の決まり
category: tolerance
rules:
  - id: TL-01
    text: 組み合う部品の隙間は、公差の積み上げより大きい
    kinds: [frame, body]
    check: clearance_mm > tolerance_stack_mm
    trust: 3
    basis: ordinary tolerance-stack practice (assumption); no single primary source was read
  - id: TL-02
    text: 固定のボルトの位置の公差は、(隙間穴の径 - ボルトの径) / 2 以内
    kinds: [frame, body]
    check: position_tolerance_mm <= (clearance_hole_mm - bolt_diameter_mm) / 2
    trust: 2
    basis: >-
      Fixed-fastener formula T = (H - F)/2 as given in Goodheart-Willcox, "GD&T: Application and
      Interpretation", 7th ed., p. 308 (secondary source; the ASME Y14.5 text itself was not opened).
      There T = position tolerance applied to all holes (the value in the feature control frame, at MMC),
      H = MMC size of the clearance holes (smallest hole), F = MMC size of the fastener (largest
      fastener). So clearance_hole_mm is the smallest clearance-hole diameter and bolt_diameter_mm the
      largest bolt diameter. Condition: holds only if the fixed (threaded / press-fit) feature carries a
      projected tolerance zone or the clearance-hole part is very thin. Floating fasteners (clearance
      holes in all parts) use T = H - F instead (same book, same page). Read 2026-11-03 in a saved copy of
      https://www.g-wonlinetextbooks.com/gdt-application-and-interpretation-2021/324 (printed page 308)
