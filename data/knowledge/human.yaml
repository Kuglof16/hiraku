# Built-in rules: people (人). See sheet-metal.yaml for the shape.
# The body sizes are AIST 1991-92 values (J2 sitting hip breadth, 95th percentile young female 391 mm;
# J6 buttock-popliteal length, 5th percentile young female 406 mm), read from the AIST tables 2026-11-03.
doc_id: KN-HU
title: 人の決まり
category: human
rules:
  - id: HU-01
    text: 座面の幅は、座位殿幅 (若年女性 95 %) 391 mm 以上
    kinds: [seat]
    check: size_y_mm >= 391
    trust: 1
    basis: >-
      AIST 人体寸法データベース 1991-92, item J2 座位殿幅:足底支持 (hip breadth, sitting, feet supported),
      statistics table https://www.airc.aist.go.jp/dhrt/91-92/data/gif/J2.gif (from
      https://www.airc.aist.go.jp/dhrt/91-92/data/list.html): young adults, female, 95th percentile 391.0 mm
      (N 202). Young adults = 18-29 years, women measured July-August 1992
      (https://www.airc.aist.go.jp/dhrt/91-92/index.html, section 1.2-1.3). The elderly female 95th
      percentile is 391.4 mm, so the limit also covers that group to within 1 mm. Read 2026-11-03
  - id: HU-02
    text: 座面の奥行きは、座位殿・膝窩距離 (若年女性 5 %) 406 mm 以下
    kinds: [seat]
    check: size_x_mm <= 406
    trust: 1
    basis: >-
      AIST 人体寸法データベース 1991-92, item J6 座位殿・膝窩距離 (buttock-popliteal length, sitting),
      statistics table https://www.airc.aist.go.jp/dhrt/91-92/data/gif/J6.gif (from
      https://www.airc.aist.go.jp/dhrt/91-92/data/list.html): young adults, female, 5th percentile 406.0 mm
      (N 202). Young adults = 18-29 years, women measured July-August 1992
      (https://www.airc.aist.go.jp/dhrt/91-92/index.html, section 1.2-1.3). The limit holds for that group
      only: the elderly (60+) female 5th percentile in the same table is 391.2 mm. Read 2026-11-03. The seat
      box may include the back, so a hit is a question to the designer, not a verdict
  - id: HU-03
    text: 動いて閉じる隙間は、指が入る 25 mm より小さくしない
    kinds: [suspension, frame]
    check: closing_gap_mm >= 25
    trust: 1
    basis: >-
      ISO 13854:1996, 4.2 Table 1 (minimum gap a: finger 25 mm; hand/wrist/fist 100, arm 120, toes 50,
      foot 120, leg 180, head 300, body 500), iTeh sample p.3 (PDF p.7),
      https://cdn.standards.iteh.ai/samples/22598/44d1054ccf4f41e1adefb8020dbaaa13/ISO-13854-1996.pdf ,
      read 2026-11-03. Condition (4.1 b): if a larger body part can foreseeably enter the crushing zone,
      the gap for the largest part applies, so 25 mm is a floor only for zones that admit nothing larger
      than a finger; children and bulky clothing must also be considered. The current edition is
      ISO 13854:2017 (2nd ed., a "minor revision" per its foreword, ANSI preview read 2026-11-03); its
      Table 1 was not reachable (the preview stops before clause 4), so the 2017 finger value is not
      checked
  # needs: headrest_height_mm (new). Literal 800 = default of R2-01 (replace with req_Q<R2-01>).
  - id: HR-01
    text: 人が乗る座席は、頭を後ろから受け止める上端が、座席の基準点から胴の線に沿って 800 mm 以上の高さにある
    kinds: [seat]
    check: headrest_height_mm >= req_Q35
    trust: 3
    basis: >-
      assumption: a passenger-car value borrowed for a small open off-road vehicle. UN Regulation No. 17, 08 series
      (MLIT text, https://www.mlit.go.jp/jidosha/un/UN_R017.pdf) para. 5.6.2 (front seats not less than 800 mm)
      and 6.5.4 (from the R point to the tangent at the top, along the torso reference line), read 2026-11-06,
      for M1 and N1; 49 CFR 571.202a S4.2.1(a)(1) (800 mm, from the H-point parallel to the torso reference line,
      S3), eCFR current text, read 2026-11-06, for US passenger cars and light vehicles. A seat with no head
      support has no value and is reported as not given, not as passing
  # needs: headrest_width_mm (new). Literal 170 = default of R2-02.
  - id: HR-02
    text: 頭を受け止める面の左右の幅は、上端から 65 mm 下で 170 mm 以上
    kinds: [seat]
    check: headrest_width_mm >= req_Q36
    trust: 3
    basis: >-
      assumption: a passenger-car value borrowed for a small open off-road vehicle. UN R17 08 series
      (https://www.mlit.go.jp/jidosha/un/UN_R017.pdf) para. 5.11 (85 mm to each side of the median plane, 170 mm
      computed) and 6.6.1 (plane 65 mm below the top), read 2026-11-06, for M1 and N1; 49 CFR 571.202a S4.2.2
      (not less than 170 mm at 65 ±3 mm below the top), eCFR current text, read 2026-11-06, for US passenger cars
      and light vehicles
  # needs: headrest_backset_mm (new). Literal 55 = default of R2-03.
  - id: HR-03
    text: 座った人の頭の後ろと、頭を受け止める面との水平のすき間は 55 mm 以下
    kinds: [seat]
    check: headrest_backset_mm <= req_Q37
    trust: 3
    basis: >-
      assumption: a US passenger-car value borrowed for a small open off-road vehicle. 49 CFR 571.202a S4.2.3
      (front outboard backset not more than 55 mm) and S3 (backset measured from the rear of the head of a seated
      50th percentile male, SAE J826 manikin with the head restraint measurement device), eCFR current text,
      https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-571/subpart-B/section-571.202a, read
      2026-11-06, for passenger cars and MPVs, trucks and buses of 4,536 kg GVWR or less. UN R17 08 series has no
      backset limit (read 2026-11-06)
  # needs: headrest_gap_mm (new). Literal 60 = default of R2-04.
  - id: HR-04
    text: 背もたれと頭を受け止める部分のあいだのすき間は、165 mm の球で測って 60 mm 以下
    kinds: [seat]
    check: headrest_gap_mm <= req_Q38
    trust: 3
    basis: >-
      assumption: a passenger-car value borrowed for a small open off-road vehicle. UN R17 08 series
      (https://www.mlit.go.jp/jidosha/un/UN_R017.pdf) para. 5.8 (not more than 60 mm for a head restraint not
      adjustable for height) and 6.7.1 (165 mm sphere), read 2026-11-06, for M1 and N1; 49 CFR 571.202a S4.2.4.1
      (no gap greater than 60 mm, 165 mm sphere), eCFR current text, read 2026-11-06, for US passenger cars and
      light vehicles
