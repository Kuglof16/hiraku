# The requirement items HIRAKU can ask about (keys Q03..Q97), the same for every product.
# Which item a product needs, and whether the person is asked, follow from the flags:
#   applies_if  expression over the product flags (hiraku.catalog.expr); an item that does not apply
#               is neither shown nor asked
#   ask         must     = nothing proceeds without an answer (no default is used)
#               confirm  = asked once with a default, the default is used when there is no answer
#               default  = not asked; the default is used and shown, the person can change it
#   question    what the hearing says (must and confirm)
#   choices_if  {when, labels: {value: label}}: the labels of the choices that change when the flags satisfy `when` (the value is
#               the contract's, only the words the person reads change: 運転者だけ -> 1 人だけ for something lain on)
#   question_if {when, text}: what it says instead when the flags satisfy `when` (the same expression as applies_if)
#   why         one line for a first-time reader: why the question is needed (shown on the screen with the question)
#   example     an example answer (shown on the screen)
#   unit        the unit a number typed as text ("150") is kept in, when the item has no numeric default (Q40, Q50)
#   choices     answers offered; the person can always write another (allow_other)
#   default     {value, unit?, trust, basis}: used when nothing better is known. A product's own
#               requirements file (data/requirements/products/) wins over it.
# trust: 1 primary source, 2 secondary source, 3 assumption. "not checked in this repository" = the
# value is taken from the cited page and that page has not been read again for this repository.
# "read 2026-11-03 in a source check" = the value was seen in the cited source at the place named, in a
# source check on that date. "tried 2026-11-03 ... not reachable" = the check could not reach the value.
# Q01 (what to make) and Q02 (the flags) are not here: they are the sentence and A1's chips.

items:
  - key: Q03
    name: 使う頻度・年数
    applies_if: always
    ask: confirm
    why: 壊れるまでに何回使われるかで、くり返しの力 (疲れ) の確かめ方を決めるためです。
    example: 週末ごとに 5 年
    question: どのくらいの頻度で、何年くらい使いますか。

  - key: Q04
    name: 段差に当たるときの速さ
    applies_if: self_propelled
    ask: default
    why: 走ったまま段差に当たると、止まった所から押し上げるときの何倍かの力が車輪とフレームにかかるためです。
    example: 10 km/h
    unit: km/h
    default:
      value: 10
      unit: km/h
      trust: 3
      basis: >-
        A design condition (HIRAKU's default value), set for the strength check of the step. It is not taken from a
        standard or a catalogue, so it has no outside source. What it gives, by the K2 calculation for the demo vehicle
        (offroad-4w-v1, two people and cargo): the front wheel force at the step is 3.6 times (100 mm step, 5.7 kN against
        1.6 kN) to 4.4 times (250 mm step, 17.6 kN against 4.0 kN) the force of pushing up from rest

  - key: Q11
    name: 路面・床と摩擦係数
    applies_if: self_propelled or standing
    ask: confirm
    why: 滑りやすさで、止まれるか・転ばないかの確かめ方が変わるためです。
    example: 砂利 / 舗装路
    question: 走る(置く)面は何ですか。摩擦係数が分かれば添えてください。
    choices: [{label: 砂利, value: 砂利}, {label: 舗装路, value: 舗装路}, {label: 土, value: 土}, {label: 屋内の床, value: 床}]

  - key: Q12
    name: 路面の粗さ (ISO 8608 のクラス)
    applies_if: self_propelled and rough
    ask: default
    default:
      value: C
      trust: 3
      basis: >-
        assumption: the class of a rough road taken as ISO 8608 class C (128-512 x 10^-6 m^3 at n0 = 0.1 cycle/m,
        table in https://link.springer.com/article/10.1007/s12544-013-0127-8) (not checked in this repository)

  - key: Q13
    name: 縦の坂
    applies_if: self_propelled
    ask: default

  - key: Q14
    name: 走りながらの横の傾き
    applies_if: self_propelled and rough
    ask: confirm
    why: 横転しやすさの確かめに使います。
    example: 15 度
    question: 走りながら、どのくらい横に傾いた斜面を通りますか。
    choices: [{label: 10°, value: 10, unit: deg}, {label: 15°, value: 15, unit: deg}, {label: 20°, value: 20, unit: deg}]

  - key: Q15
    name: 段差
    applies_if: self_propelled
    ask: confirm
    why: 越える段差の高さで、衝撃の大きさが決まるためです。
    example: 100 mm
    question: 越える段差の高さは。

  - key: Q16
    name: 通る幅
    applies_if: self_propelled
    ask: default

  - key: Q17
    name: 曲がり
    applies_if: self_propelled
    ask: default

  - key: Q18
    name: 風
    applies_if: outdoor
    ask: default
    default:
      value: 20
      unit: m/s
      trust: 1
      basis: >-
        気象庁「風の強さと吹き方」 平均 20 m/s (瞬間は約 1.5 倍), https://www.jma.go.jp/jma/kishou/know/yougo_hp/kazehyo.pdf,
        and the JMA glossary 非常に強い風 "20m/s以上30m/s未満", https://www.jma.go.jp/jma/kishou/know/yougo_hp/kaze.html;
        read 2026-11-03 in a source check

  - key: Q19
    name: 気温 (範囲の高い端)
    applies_if: battery or electric or outdoor
    ask: confirm
    why: 電池や樹脂が熱で弱くならないかを確かめるためです。
    example: 40 度
    question: 使う場所の気温の高い側は何度ですか。
    default: {value: 40, unit: degC, trust: 3, basis: assumption (the hot end of the range of use)}

  - key: Q20
    name: 水・ほこり (IP)
    applies_if: battery or electric
    ask: confirm
    why: 雨や泥で電気の部品が壊れないかの確かめに使います。
    example: 水の飛まつ
    question: 水やほこりへの強さ (IP) はどのくらい要りますか。
    choices: [{label: 対策なし, value: IPX0}, {label: 水の飛まつ, value: IPX4}, {label: 水・ほこりに強い, value: IP54}, {label: 水に浸かっても, value: IP67}]

  - key: Q21
    name: 荷台の固定点 1 か所が受けられる力の下限
    applies_if: cargo
    ask: default
    why: 帯や鎖が強くても、荷台の側の固定点が先に壊れれば荷は止まらないためです。
    example: 8000 N
    default:
      value: 8000
      unit: N
      trust: 3
      basis: >-
        assumption: the smallest row for goods road vehicles borrowed for a much lighter vehicle. EN 12640 as quoted in
        the European Best Practice Guidelines on Cargo Securing for Road Transport (2014) 2.6, Table 3: vehicle total
        mass 3.5 to 7.5 t, strength of a lashing point 800 daN (= 8 000 N), read 2026-11-06 (secondary, PDF p. 23);
        the table has no row below 3.5 t; EN 12640 itself not checked (paid). The CTU Code 6.6.8 says most goods road
        vehicles have points of LC or MSL 20 kN, read 2026-11-06 (p. 27). No ROV standard or manual read gives a
        strength for cargo bed anchors

  - key: Q22
    name: 電線の電流を確かめるときの周りの温度
    applies_if: electric or battery
    ask: default
    why: 電線が流してよい電流は周りが熱いほど小さくなるので、どの温度で確かめるかを先に決めるためです。
    example: 40 degC (モーターや制御器のそばはもっと高いことがあります)
    default:
      value: 40
      unit: degC
      trust: 3
      basis: >-
        assumption: 40 degC is the ambient air temperature of the automotive current rating table in the Anixter catalogue,
        page 02•43 "Current Ratings for Automotive Cables" (ambient 40 degC, single cable isolated in free air),
        https://objects.eanixter.com/PD379251-AN.PDF, read 2026-11-06 (secondary: a distributor's technical page). It is
        the condition of that table, not a measured temperature of this vehicle: near the motor, the controller, the brakes
        or in the sun it can be higher, and then the table value is too high

  - key: Q23
    name: 束ねて触れ合う電線の、流してよい電流の割合
    applies_if: electric or battery
    ask: default
    why: 電線を束ねると熱が逃げにくくなり、1 本のときより少ない電流しか流せないためです。
    example: 0.5 (8 本までの束)
    default:
      value: 0.5
      unit: "1"
      trust: 2
      basis: >-
        Anixter catalogue, page 02•43 "Current Ratings for Automotive Cables", note: wires grouped and touching, rating
        factor 2 cables 0.80, 3 0.70, 4 0.65, 5 0.60, 6 0.56, 7 0.53, 8 0.50, https://objects.eanixter.com/PD379251-AN.PDF,
        read 2026-11-06 (secondary: a distributor's technical page for automotive cable; the standard or calculation
        behind it is not named). 0.50 (8 cables) is taken so that one number covers a harness of up to 8 touching
        cables; more than 8 cables is not in the table (not checked). Similar factors for other classes, borrowed and not
        used: 33 CFR 183 Table 5 note 2 (boats, 7-24 conductors 0.50), DIN VDE 0298-4 Table 21 quoted by Lapp Table 12-6
        (industrial cables, 8 cables 0.52)

  - key: Q24
    name: 回路を守る器具の定格電流の、守る電線の流してよい電流に対する上限の割合
    applies_if: electric or battery
    ask: default
    why: ショートや流れ過ぎのときに、電線が熱くなって燃える前に回路を切るためです。
    example: 1.0 (電線の許容電流を超えない)
    default:
      value: 1.0
      unit: "1"
      trust: 3
      basis: >-
        assumption: borrowed from aircraft and boats. FAA AC 43.13-1B with Change 1, par. 11-48: a circuit breaker is rated
        so that it opens before the current rating of the wire attached to it is exceeded, read 2026-11-06
        (https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf; aircraft wiring). 33 CFR
        183.455(c), read 2026-11-06 (https://www.ecfr.gov/current/title-33/chapter-I/subchapter-S/part-183/subpart-I;
        boats with gasoline engines): not above 150 % of the Table 5 amperage for circuits under 50 V, not above 100 % for
        50 V or more (the next larger standard size allowed if it does not exceed 150 %). The 51.2 V circuit is above
        50 V, so 1.0 is taken for every circuit. The road-vehicle rules (ISO 8820, ISO 6469-3:2021 clauses 7.1 and 7.2)
        were not checked

  - key: Q25
    name: 1 本の電線を曲げる内側の半径の下限 (電線の外径の倍数、動かない所)
    applies_if: electric or battery
    ask: default
    why: きつく曲げると被覆や導体が傷み、振動でそこから切れるためです。
    example: 3 (外径 9.4 mm の電線なら 28.2 mm 以上)
    default:
      value: 3
      unit: "1"
      trust: 2
      basis: >-
        Coficab data sheet FLRY / FLRY sn, rev. AM 09.03.2022, page 1 Technical data: min. bending radius 3 x D (static),
        https://media.iewc.com/PublicAssets/SpecificationSheets/COF-2010-01-AM-FLRY---FLRY-sn.pdf, read 2026-11-06
        (a manufacturer's data sheet, 60 V thin-wall PVC automotive cable, ISO 19642-3 class B). Static only: a cable that
        moves (to the steering or the suspension) is not covered; for moving flexible cords the Anixter catalogue page
        02•67 (after BS 7540, cords up to 450/750 V, borrowed) gives 5D up to 12 mm and 6D above, read 2026-11-06

  - key: Q26
    name: 束ねた電線を曲げる内側の半径の下限 (束の中でいちばん太い電線の外径の倍数)
    applies_if: electric or battery
    ask: default
    why: 束を曲げると外側の電線が引っ張られ、内側の電線が押しつぶされるためです。
    example: 10
    default:
      value: 10
      unit: "1"
      trust: 3
      basis: >-
        assumption: borrowed from aircraft wiring. FAA AC 43.13-1B with Change 1, par. 11-96 aa and 11-117: the bend radius
        of wire groups or bundles not less than 10 times the outside diameter of the largest wire (3 times in 11-96 aa, 6
        times in 11-117, where suitably supported at breakouts or reversals), read 2026-11-06,
        https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf. No road-vehicle value for a
        bundle was read

  - key: Q27
    name: 配線を支える点どうしの間隔の上限
    applies_if: electric or battery
    ask: default
    why: 支えの間が長いと、悪路の揺れで電線がたわんで振られ、こすれたり留め具の所で切れたりするためです。
    example: 609.6 mm
    default:
      value: 609.6
      unit: mm
      trust: 3
      basis: >-
        assumption: borrowed from aircraft wiring. FAA AC 43.13-1B with Change 1, par. 11-96 a and 11-146: wires and cables
        supported at intervals not more than 24 in (= 609.6 mm, computed) unless in troughs, ducts or conduits; 11-118:
        normally not more than 1/2 in (12.7 mm) deflection between supports, read 2026-11-06,
        https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf. A public road-vehicle spacing
        (SAE J1292, an OEM harness guide) was not found; this vehicle shakes more on rough tracks than an aircraft in
        normal flight, so the borrowed value may be too long (not checked)

  - key: Q28
    name: 板や縁を通り抜ける所での、配線と縁の隙間の下限 (留められない所)
    applies_if: electric or battery
    ask: default
    why: 揺れで電線が板の縁にこすれ、被覆がすり切れてショートするのを防ぐためです。
    example: 9.525 mm
    default:
      value: 9.525
      unit: mm
      trust: 3
      basis: >-
        assumption: borrowed from aircraft wiring. FAA AC 43.13-1B with Change 1, par. 11-115: protective grommets wherever
        wires cannot be clamped, so that there is at least 3/8 in (= 9.525 mm, computed) clearance from structure at
        penetrations, read 2026-11-06, https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf.
        33 CFR 183.445(a) (boats) asks that a conductor through a bulkhead or other rigid surface is protected from abrasion,
        with no number, read 2026-11-06 (https://www.ecfr.gov/current/title-33/chapter-I/subchapter-S/part-183/subpart-I)

  - key: Q29
    name: 動かして操作する仕組みと配線の隙間の下限
    applies_if: (electric or battery) and ride
    ask: default
    why: ハンドルなど動く所に電線が当たると、こすれて切れたり、操作のじゃまになったりするためです。
    example: 12.7 mm
    default:
      value: 12.7
      unit: mm
      trust: 3
      basis: >-
        assumption: borrowed from aircraft wiring. FAA AC 43.13-1B with Change 1, par. 11-96 dd (mechanical control cables)
        and 11-125 (movable controls): at least 1/2 in (= 12.7 mm, computed) between wiring and the controls when the
        bundle is pushed with light hand pressure toward them, read 2026-11-06,
        https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf

  - key: Q30
    name: 人数と荷重の組み合わせ
    applies_if: ride or lean
    ask: must
    why: 人数と荷の組み合わせで、重さのかかり方が変わるためです。
    example: 2 人 + 荷
    question: "どの組み合わせを見ますか (空車・運転者だけ・2 人・2 人 + 荷)。乗る人だけを数え、介助者のように乗らない人は数えません。"
    question_if: {when: lean and not ride, text: "どの組み合わせを見ますか (空車・1 人だけ・2 人・2 人 + 荷)。乗る人だけを数え、介助者のように乗らない人は数えません。"}
    choices: [{label: 空車, value: empty}, {label: 運転者だけ, value: driver}, {label: 2 人, value: two}, {label: 2 人 + 荷, value: two_cargo}]
    choices_if: {when: lean and not ride, labels: {driver: 1 人だけ}}

  - key: Q31
    name: 体格の範囲
    applies_if: ride or lean or near_people or handheld
    ask: default
    default:
      value: 若年女性 5 % 〜 若年男性 95 %
      trust: 1
      basis: >-
        AIST 人体寸法データベース 1991-92, 項目 B1 身長, 若年 (young adults), パーセンタイル 5 % の女性 1511.2 mm
        から 95 % の男性 1819.6 mm, https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (B1 table read 2026-11-06)

  - key: Q32
    name: 体重 (法令の計算用)
    applies_if: ride and public_road
    ask: default
    default:
      value: 55
      unit: kg
      trust: 1
      basis: >-
        細目告示 第2条 第九号 "乗車定員1人の重量は55kg", PDF p.2 (the 2026.1.9 version),
        https://www.mlit.go.jp/jidosha/content/S002.pdf; read 2026-11-03 in a source check

  - key: Q33
    name: 体重 (強さの不利側)
    applies_if: ride or lean
    ask: default
    default:
      value: 76.6
      unit: kg
      trust: 1
      basis: >-
        AIST 人体寸法データベース 1991-92, 項目 N1 体重, 若年男性 (young adults, M) 95 パーセンタイル 76.6 kg,
        https://www.airc.aist.go.jp/dhrt/91-92/data/list.html (N1 table read 2026-11-06)

  - key: Q34
    name: 弱い人がいるか
    applies_if: always
    ask: confirm
    why: いる場合は、はさまれや倒れかかりをより厳しく見るためです。
    example: いない / 子ども
    question: 子どもや高齢者など、力の弱い人が使ったり、そばにいたりしますか。
    choices: [{label: いない, value: いない}, {label: 高齢者, value: 高齢者}, {label: 子ども, value: 子ども}, {label: 高齢者と子ども, value: 高齢者と子ども}]

  - key: Q35
    name: 頭を後ろから受け止める高さの下限 (座席の基準点から、胴の線に沿って上へ)
    applies_if: ride and self_propelled
    ask: confirm
    why: 後ろからぶつけられたとき、首が後ろへ折れないように、頭の後ろに受け止めるものが届く高さかを確かめるためです。
    example: 800 mm
    question: 座った人の頭を後ろから受け止める高さは、座席の基準点 (腰のあたり) から胴の傾きに沿って、いくつ以上にしますか。
    default:
      value: 800
      unit: mm
      trust: 3
      basis: >-
        assumption: a passenger-car value borrowed for a small open off-road vehicle. UN Regulation No. 17, 08 series
        (MLIT English/Japanese text, https://www.mlit.go.jp/jidosha/un/UN_R017.pdf), para. 5.6.2 and 5.6.3.1 (front
        seats not less than 800 mm, other seats 750 mm) and para. 6.5.4 (the height is from the R point, the seating
        reference point of para. 2.13, to the tangent at the top, measured along the manikin's torso reference
        line), read 2026-11-06; R17 applies to M1 and N1 (para. 1). 49 CFR 571.202a (FMVSS 202a, eCFR current text,
        https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-571/subpart-B/section-571.202a) S4.2.1(a)(1)
        (front outboard not less than 800 mm in at least one position) with S3 (height from the H-point parallel to
        the torso reference line), read 2026-11-06; it applies to passenger cars and to MPVs, trucks and buses of
        4,536 kg GVWR or less (S2). UN R25 was not checked (not reachable). No text read requires this for an
        off-road utility or recreational vehicle; ANSI/ROHVA 1, ANSI/OPEI B71.9 and SAE J2258 were not checked

  - key: Q36
    name: 頭を後ろから受け止める面の左右の幅の下限
    applies_if: ride and self_propelled
    ask: default
    why: 頭が横にずれても、後ろで受け止められる幅があるかを確かめるためです。
    example: 170 mm
    default:
      value: 170
      unit: mm
      trust: 3
      basis: >-
        assumption: a passenger-car value borrowed for a small open off-road vehicle. UN Regulation No. 17, 08 series
        (https://www.mlit.go.jp/jidosha/un/UN_R017.pdf) para. 5.11 (not less than 85 mm to each side of the seat's
        vertical median plane; 2 x 85 = 170 mm computed) and para. 6.6.1 (measured in a plane 65 mm below the top,
        perpendicular to the torso reference line), read 2026-11-06, for M1 and N1. 49 CFR 571.202a S4.2.2 (not
        less than 170 mm at 65 ±3 mm below the top; 254 mm for a front outboard seat when a front centre seat
        exists), eCFR current text, read 2026-11-06, for US passenger cars and light vehicles (S2)

  - key: Q37
    name: 頭の後ろと、それを受け止める面との前後のすき間の上限
    applies_if: ride and self_propelled
    ask: default
    why: 受け止める面が頭から遠いと、ぶつけられたときに頭が大きく後ろへ振られてから止まるためです。
    example: 55 mm
    default:
      value: 55
      unit: mm
      trust: 3
      basis: >-
        assumption: a US passenger-car value borrowed for a small open off-road vehicle. 49 CFR 571.202a S4.2.3
        (front outboard backset not more than 55 mm) with S3 (backset = the minimum horizontal distance from the rear
        of the head of a seated 50th percentile male, head restraint measurement device on the SAE J826 manikin, to
        the head restraint) and S5.2.3 (top set between 750 and 800 mm, seat back at the design angle), eCFR current
        text, https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-571/subpart-B/section-571.202a, read
        2026-11-06; applies to passenger cars and MPVs, trucks and buses of 4,536 kg GVWR or less (S2). UN R17 08
        series has no backset limit (the word does not occur in the MLIT text, read 2026-11-06); later R17 series
        and UN R25 were not checked

  - key: Q38
    name: 背もたれと、頭を受け止める部分のあいだのすき間の上限
    applies_if: ride and self_propelled
    ask: default
    why: 背もたれと頭を受け止める部分のあいだに、頭や首が入り込む大きな穴が残っていないかを確かめるためです。
    example: 60 mm
    default:
      value: 60
      unit: mm
      trust: 3
      basis: >-
        assumption: a passenger-car value borrowed for a small open off-road vehicle. UN Regulation No. 17, 08 series
        (https://www.mlit.go.jp/jidosha/un/UN_R017.pdf) para. 5.8 (no gap of more than 60 mm between the seat back
        and a head restraint not adjustable for height; 25 mm in the lowest position if adjustable) and para. 6.7.1
        (gaps measured with a 165 mm sphere), read 2026-11-06, for M1 and N1. 49 CFR 571.202a S4.2.4.1 (no gap
        greater than 60 mm with a 165 mm sphere), eCFR current text, read 2026-11-06, for US passenger cars and
        light vehicles

  - key: Q39
    name: 電池の端子から、最初に回路を守る器具までの電線の長さの上限
    applies_if: battery
