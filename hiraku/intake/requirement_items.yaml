    choices: [{label: 分からない (0.3), value: 0.3}, {label: ゴムのマットを敷く (0.6), value: 0.6}, {label: 木の荷と合板の床 (0.45), value: 0.45}, {label: 樹脂のパレットとステンレス板・溝付きアルミの床 (0.15), value: 0.15}, {label: 雪・氷・霜がつく (0.2), value: 0.2}, {label: 油や脂がつく (0.1), value: 0.1}]
