  - key: Q93
    name: 乗り降りの開口の前後の幅 (座面より上で、人の胴が通る部分の最小)
    applies_if: ride and rough
    ask: default
    why: 座った人が横から入って出られる通り道を、残しているか確かめるためです。横の守りに付けて働く網は、横から押す試験では外して行うので、押す力を受ける守りには数えません。動かない守りと、この開口の両方が要ります。
    example: 450 mm (勧めは 680 mm)
    default:
      value: 450
      unit: mm
      trust: 3
      basis: >-
        ISO 4252:1983 Figure 1 (450 mm min at 1 000 mm above the door sill, 470 mm min at 1 250 mm) and ISO 2867:1980 10.1
        (450 mm min from 770 to 1 550 mm above the platform, 680 mm recommended), read 2026-11-04. Both are an older edition of a standard for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle could be read).
        The current ISO 4252:2007 and ISO 2867:2011 were not checked

  - key: Q94
    name: 乗り降りの開口の前後の幅 (床から座面の高さまでの、足と脚が通る部分の最小)
    applies_if: ride and rough
    ask: default
    why: 足を床から外へ出し入れするときに、脚が下の守りや車体に当たらないか確かめるためです。横の守りに付けて働く網は、横から押す試験では外して行うので、押す力を受ける守りには数えません。動かない守りと、この開口の両方が要ります。
    example: 300 mm
    default:
      value: 300
      unit: mm
      trust: 3
      basis: >-
        ISO 2867:1980 10.1 (300 mm min from the platform up to 770 mm), read 2026-11-04; ISO 4252:1983 Figure 1 gives
        250 mm min for the lower part (the larger is kept), read 2026-11-04. Both are an older edition of a standard for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle could be read)

  - key: Q95
    name: 乗り降りの開口の高さ (座面の面から上へ、ふさいではいけない最小)
    applies_if: ride and rough
    ask: default
    why: 座ったまま上体を外へ出し入れするときに、頭が上の枠に当たらないか確かめるためです。横の守りに付けて働く網は、横から押す試験では外して行うので、押す力を受ける守りには数えません。動かない守りと、この開口の両方が要ります。
    example: 985 mm
    default:
      value: 985.2
      unit: mm
      trust: 3
      basis: >-
        assumption: H = AIST 人体寸法データベース 1991-92, I1 座高 (seat surface to vertex), young adults, men, 95 percentile
        = 985.2 mm (N 217), read 2026-11-04 in the table. No standard read gives a height above the seat surface

  - key: Q96
    name: 乗り降りの開口の高さ (床・敷居から上へ、ふさいではいけない最小)
    applies_if: ride and rough
    ask: default
    why: 立ったまま、または身をかがめて出入りするときに、頭と肩が通るか確かめるためです。横の守りに付けて働く網は、横から押す試験では外して行うので、押す力を受ける守りには数えません。動かない守りと、この開口の両方が要ります。
    example: 1250 mm
    default:
      value: 1250
      unit: mm
      trust: 3
      basis: >-
        ISO 4252:1983 Figure 1 (1 250 mm min above the door sill; its NOTE lets the measuring heights be lowered where the seat
        is reached straight from the footstep), read 2026-11-04; ISO 2867:1980 10.2 recommends 1 300 mm or more from the floor
        in sit-down cabs, read 2026-11-04. Both are an older edition of a standard for agricultural tractors or earth-moving machinery, borrowed for this vehicle (an assumption: no standard for a small open off-road vehicle could be read)

  - key: Q97
    name: 地面から最初の足を置く面 (床の上面か最初の段) までの高さの上限
    applies_if: ride and rough
