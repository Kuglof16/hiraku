  - key: Q83
    name: 操舵の回転を折って伝える所の、1 か所あたりの折れ角の上限
    applies_if: ride and self_propelled
    ask: confirm
    why: 折れ角が大きすぎると、ハンドルが重い所と軽い所ができたり、引っかかって回らなくなったりするためです。
    example: 35°
    question: ハンドルの回転を、軸を折り曲げて車輪の側へ伝えるとき、1 か所で折ってよい角度はいくつまでにしますか。使う部品の決まった値があれば、それを書いてください。
    default:
      value: 35
      unit: deg
      trust: 3
      basis: >-
        assumption: the maximum operating angle of one maker's single steering universal joints, applied to the
        joints of this vehicle, whose maker is not chosen. Borgeson Universal, "U-Joint & Shaft General Instructions"
        (sheet dated 3/20/2018), item 1): single joints 35 degrees, double joints 70 degrees, beyond which the joint
        can bind and be damaged; read 2026-11-06 (https://sdda.semadata.org/Standard/Borgeson/JOINT_SHAFT_GENERAL.pdf).
        These are aftermarket steering joints of cars. Industrial joints are rated otherwise (read 2026-11-06): Huco
        Universal Joints catalogue section 2, PDF p. 8, needle roller T series 40 deg single, 80 deg double; PDF p. 9,
        plain bearing DIN 808 joints 45 deg single, 90 deg double; PDF p. 6, plain T series sizes 50 and up 30 deg
        (https://theengineer.markallengroup.com/production/content/uploads/2012/05/universal_joints.pdf); Timken
        NB10-UJ needle bearing type, max operating angle for power transmission 25 deg
        (https://cad.timken.com/printitem/needle-bearing-type-universal-joints/eedle-bearing-type-universal-solid-joints-imperial/68514415607).
        Borgeson's web page (https://www.borgeson.com/joints.html) was not checked (403). The joint actually chosen and
        its catalogue win over this value

  - key: Q84
    name: ハンドルから車輪の側へ伝わる回転のむらの上限
    applies_if: ride and self_propelled
    ask: default
    why: 折れた軸を通すと、ハンドルを一定に回しても先の回転が速くなったり遅くなったりし、手に感じる重さが 1 回転の中で変わるためです。
    example: 10 %
    default:
      value: 10
      unit: "%"
      trust: 3
      basis: >-
        assumption: the example value of an allowable torque variation rate in a passenger-car steering design tool,
        applied to this vehicle. NSK Ltd, US 8,965,743 B2 (granted 2015-02-24), description of FIG. 21-27: the
        allowable torque variation rate is "for example, 10%" (FIG. 23-27 compare 10 % down to 3 %); the torque
        variation rate is the ratio of input to output torque, the inverse of the angular velocity ratio (its Equation
        (5) is an image and was not read); read 2026-11-06 in the Google Patents text
        (https://patents.google.com/patent/US8965743B2/en). HIRAKU takes the rate as the largest deviation of the
        output-to-input speed ratio from 1 over one turn (an assumption about the patent's definition). The ratio of
        one joint, w_out/w_in = cos a / (1 - cos^2 t * sin^2 a) (a = angle between the shafts, t = turn of the input
        from the position where its arm of the cross lies in the plane of the two shafts), max 1/cos a, min cos a:
        Mustansiriyah University lecture note "universal joint", PDF p. 7-8, read 2026-11-06 (secondary)
        (https://uomustansiriyah.edu.iq/media/lectures/5/5_2021_12_11!08_27_23_PM.pdf); the same range w cos a to
        w sec a in Huco Universal Joints catalogue section 2, PDF p. 2, read 2026-11-06. No standard for steering was read

