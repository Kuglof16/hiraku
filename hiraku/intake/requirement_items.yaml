      unit: mm
      trust: 3
      basis: >-
        assumption: borrowed from boats. 33 CFR 183.460(a): each ungrounded output conductor from a storage battery has a
        trip-free circuit breaker or fuse within 72 in (= 1828.8 mm, computed) of the battery, measured along the
        conductor (the cranking motor feed is excepted); 183.455(b) puts the device at the source of power, or within 7 in
        (177.8 mm), or within 40 in (1016 mm) if the conductor is sheathed, read 2026-11-06,
        https://www.ecfr.gov/current/title-33/chapter-I/subchapter-S/part-183/subpart-I (boats with gasoline engines).
        The longest of these is taken; a road-vehicle value was not checked

