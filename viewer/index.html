<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HIRAKU 解析の結果</title>
<style>
  /* HIRAKU's screen: the colours and fonts are web/css/app.css :root (copied here; the page opens from disk and
     does not load web/). "Unbleached paper and black ink"; red only for a criterion's NG. */
  :root {
    --ink: #1d1d1f; --paper: #f4f1ea; --panel: #fbf9f4; --card: #fffdf8; --muted: #6b665c; --rule: #e2dccf; --line: #c9c3b6;
    --green: #2f7d4f; --red: #c8402a; --red-pale: #fbebe5; --blue: #2b59c3; --purple: #8e6bbf; --yellow: #e8c547; --orange-pale: #fcefdc;
    --font: "BIZ UDPGothic", "BIZ UDGothic", "Yu Gothic", Meiryo, sans-serif;
    --mono: "BIZ UDGothic", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.45 var(--font); background: var(--paper); color: var(--ink); }
  #view { position: absolute; left: 0; top: 86px; right: 340px; bottom: 236px; }
  #view canvas { display: block; }
  /* the side panel: web/css/app.css .panel (panel colour, 1.5px line, rounded) */
  #panel { position: absolute; top: 0; right: 0; width: 340px; bottom: 0; overflow-y: auto; background: var(--panel); border-left: 1.5px solid var(--line); padding: 8px 14px 40px; }
  #panel h3 { margin: 14px 0 5px; font-size: 14px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--rule); padding-bottom: 2px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; flex-wrap: wrap; }
  .row input[type=range] { flex: 1; min-width: 80px; accent-color: var(--ink); }
  .row input[type=number] { width: 70px; font: inherit; border: 1.5px solid var(--line); border-radius: 6px; background: var(--card); padding: 1px 4px; }
  input[type=checkbox], input[type=radio] { accent-color: var(--ink); }
  select { font: inherit; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); padding: 1px 4px; }
  .val { width: 62px; font-size: 12px; font-variant-numeric: tabular-nums; }
  /* buttons: web/css/app.css .tab / .pill (1.5px border, rounded, the chosen one in ink on the panel colour) */
  button { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 12px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.on { border-color: var(--ink); background: var(--ink); color: var(--panel); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  #switch { display: flex; flex-wrap: wrap; gap: 4px; }
  #switch[hidden], #switchHead[hidden] { display: none; }   /* one field with data: no switch (js/main.js) */
  #switch button { font-size: 14px; padding: 3px 12px; }
  /* nothing is drawn over the 3D view: the header sits above it, the rest in the side panel and the bottom pane */
  #hud { position: absolute; left: 0; top: 0; right: 340px; height: 86px; overflow: hidden; padding: 4px 16px; background: var(--paper); border-bottom: 1px solid var(--rule); }
  #head1 { display: flex; gap: 14px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  #title { font-size: 17px; font-weight: 600; flex: none; }
  #source { font-size: 13px; color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; }
  #tline { font-size: 13.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hudlines div { font-size: 12.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend { display: block; margin: 4px 0; }
  #notes { font-size: 12.5px; color: var(--muted); }
  /* the click info: web/css/app.css .card */
  #info { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 10px; display: none; font-size: 13px; }
  .sw { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--ink); border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .lg, .pl { font-size: 12.5px; margin: 2px 0; }
  table.mt { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 4px; }
  table.mt td, table.mt th { border-bottom: 1px solid var(--rule); padding: 2px 3px; text-align: left; }
  table.mt th { color: var(--muted); font-weight: 600; }
  table.mt tr.tot td { font-weight: 600; border-top: 1.5px solid var(--line); }
  /* OK / NG: web/css/app.css .verdict.ok / .verdict.bad */
  .ok { color: var(--green); font-weight: 600; } .ng { color: var(--red); font-weight: 600; }
  details { margin: 3px 0; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  details[open] > summary { color: var(--ink); }
  hr { border: 0; border-top: 1px solid var(--rule); }
  /* the bottom pane: plots and inputs side by side, each in its own box (the canvas sized by its box, so its
     drawing size never pushes the inputs or the 3D view) */
  #bottom { position: absolute; left: 0; right: 340px; bottom: 0; height: 236px; border-top: 1.5px solid var(--line); background: var(--panel); display: flex; overflow: hidden; }
  #plotwrap { flex: 1 1 0; min-width: 0; position: relative; overflow: hidden; }
  #plot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #inputs { flex: 0 0 400px; border-left: 1px solid var(--rule); padding: 6px 12px; overflow: auto; font-size: 12.5px; }
  #inputs td { overflow-wrap: anywhere; }
  #inputs td:first-child { white-space: nowrap; overflow-wrap: normal; }
  #inputs .h { font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 2px; }
  #inputs table { border-collapse: collapse; width: 100%; }
  #inputs td { vertical-align: top; padding: 2px 6px 2px 0; border-bottom: 1px solid var(--rule); }
  .muted { color: var(--muted); font-size: 12px; }
  .code { color: var(--muted); font-size: 11px; font-family: var(--mono); }   /* a quantity's code name after its Japanese name */
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--paper); z-index: 10; }
  label { user-select: none; }
  #fieldpanel .list { max-height: 260px; overflow-y: auto; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); }
  #fieldpanel .list div { padding: 1px 6px; cursor: pointer; }
  #fieldpanel .list div.on { background: var(--ink); color: var(--panel); }
  /* the large play button at the 3D view's lower left (the panel's 「▶ 再生」 found at a glance): red with a white rim
     until pressed (the one red that is not a criterion's NG, as the person asked), dark while it plays (「❚❚ 止める」) */
  #bigplay { position: absolute; left: 16px; bottom: 252px; z-index: 5; font-size: 20px; font-weight: 700; padding: 10px 26px;
    background: #d3352b; color: #fff; border: 2px solid #fff; box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
  #bigplay:hover { background: #b02a21; border-color: #fff; }
  #bigplay.playing, #bigplay.playing:hover { background: #1c1f24; }
  #bigplay[hidden] { display: none; }
</style>
<!-- three.js r170 (0.170.0) from jsDelivr, the same version and URL form as web/index.html. -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="js/names.js"></script>
<script src="js/look.js"></script>
<script src="js/core.js"></script>
<script src="js/plot.js"></script>
<script src="js/main.js"></script>
<script src="js/nvh.js"></script>
<script src="js/crash.js"></script>
<script src="js/assembly.js"></script>
<script src="js/strength.js"></script>
<script src="js/fatigue.js"></script>
<script src="js/thermal.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/handling.js"></script>
<script src="js/powertrain.js"></script>
<script src="js/aero.js"></script>
<script src="js/rops.js"></script>
<script src="js/aero_cfd.js"></script>
<script src="js/water.js"></script>
</head>
<body>
<div id="loading">読み込み中…</div>
<div id="view"></div>
<button id="bigplay" type="button" hidden>▶ 動きを再生</button>
<div id="hud">
  <div id="head1"><span id="title"></span><span id="source"></span></div>
  <div id="tline"></div>
  <div id="hudlines"></div>
</div>
<div id="bottom"><div id="plotwrap"><canvas id="plot"></canvas></div><div id="inputs"></div></div>

<div id="panel">
  <h3 id="switchHead">分野</h3>
  <div id="switch"></div>

  <h3>選択</h3>
  <div id="info"></div>
  <div class="muted" id="infohint">部材か部品をクリック</div>

  <h3>色</h3>
  <canvas id="legend" width="300" height="250"></canvas>
  <div class="row" id="logrow"><label><input type="checkbox" id="logc"> 対数目盛</label></div>

  <h3>部品と計算での扱い</h3>
  <div class="row"><label><input type="checkbox" id="lyParts"> 部品をすべて表示</label>
    <select id="ledgerMode"><option value="category">扱いで色分け</option><option value="grey">薄い灰色</option><option value="field">この分野の色</option></select></div>
  <div id="ledgerLegend"></div>
  <div id="ledgerLists"></div>
  <details id="ledgerTableBox"><summary>質量の内訳と照合</summary><div id="ledgerTable"></div></details>

  <div id="fieldpanel"></div>

  <h3 id="scaleLabel">倍率</h3>
  <div class="row"><input type="range" id="scale"><input type="number" id="scaleNum"></div>
  <div class="muted" id="scaleNote"></div>

  <h3>時間</h3>
  <div class="row"><button id="play">▶ 再生</button><button id="prev">◀</button><button id="next">▶</button></div>
  <div class="row"><input type="range" id="time" min="0" max="0" step="1" value="0"></div>
  <div class="row" id="speedrow"><label>再生の速さ (実時間の)
    <select id="speed"><option value="0.005">0.005 倍</option><option value="0.01" selected>0.01 倍</option><option value="0.02">0.02 倍</option>
      <option value="0.05">0.05 倍</option><option value="0.1">0.1 倍</option><option value="0.25">0.25 倍</option><option value="0.5">0.5 倍</option><option value="1">1 倍</option>
      <option value="2">2 倍</option><option value="10">10 倍</option><option value="50">50 倍</option><option value="200">200 倍</option></select></label></div>
  <div class="muted" id="timeNote"></div>

  <h3>表示</h3>
  <div class="row"><label><input type="checkbox" id="lyFrame"> フレーム</label>
    <label><input type="checkbox" id="lyGhost"> 変形前</label>
    <label><input type="checkbox" id="lyScene"> 地面・壁・台・路面</label>
    <label><input type="checkbox" id="lyArrows"> 力の矢印</label></div>

  <h3>断面</h3>
  <div id="clips"></div>
  <div class="muted" style="margin-top:8px">+x 前、+y 左、+z 上 (mm)。左ドラッグ 回転、右ドラッグ 移動、ホイール 拡大。</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
window.THREE = THREE;
window.OrbitControls = OrbitControls;
window.RoomEnvironment = RoomEnvironment;   // the sky light of web/js/look.js's real look without its HDRI
await HV.main();
</script>
</body>
</html>
